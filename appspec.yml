version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/LikeMinds-Authentication/
    file_exists_behavior: OVERWRITE
hooks:
  ApplicationStart:
    - location: scripts/build_auth
      timeout: 300
      runas: root
    - location: scripts/start_auth
      timeout: 300
      runas: root
