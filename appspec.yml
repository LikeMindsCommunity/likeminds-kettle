version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/LikeMinds-Authentication/
hooks:
  ApplicationStart:
    - location: /home/ubuntu/LikeMinds-Authentication/scripts/build_auth
      timeout: 300
      runas: root
    - location: /home/ubuntu/LikeMinds-Authentication/scripts/start_auth
      timeout: 300
      runas: root
