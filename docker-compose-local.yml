services:
  auth_redis:
    image: redis
    container_name: auth_redis
    ports:
      - 6379:6379
    restart: unless-stopped
    networks:
      - likeminds-network

  auth:
    container_name: auth
    build:
      dockerfile: ./Dockerfile.kettle-local
    ports:
      - 8080:8080
    environment:
      - CORE_BASE_URL=http://caravan:8000
      - SUBSCRIPTION_BASE_URL=http://skulk:8080
      - SWARM_BASE_URL=http://swarm:8081
      - PANDEMONIUM_BASE_URL=http://pandemonium:8081
      - PANDEMONIUM_WS_URL=ws://pandemonium:8081
      - REDIS_DSN=auth_redis:6379
    restart: always
    networks:
      - likeminds-network
    depends_on:
      - auth_redis

networks:
  likeminds-network:
    external: true

