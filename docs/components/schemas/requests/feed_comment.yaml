type: object
properties:
  text:
    type: string
    description: The text of the comment
    example: "This is a comment"
  temp_id:
    type: string
    description: The temporary id of the comment
    example: "123456"
  attachments:
    type: array
    description: The attachments of the comment
    items:
      type: object
      properties:
        attachment_type:
          type: integer
          description: The type of the attachment, only 1 (image), 5 (custom widget), 10 (GIF) is supported
          enum: [1, 4, 5]
          example: 1
        attachment_meta:
          $ref: "../responses/partials/attachment_meta.yaml"
