type: object
properties:
  success:
    type: boolean
    description: Indicates whether the request was successful.
  data:
    type: object
    properties:
      chatroom:
        $ref: "./partials/chatroom.yaml"
      community:
        $ref: "./partials/community.yaml"
      conversation_users:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
            image_url:
              type: string
              format: uri
            name:
              type: string
      is_draft:
        type: boolean
      last_conversation:
        $ref: "./partials/lastConversation.yaml"
      last_conversation_time:
        type: string
      member_right_states:
        type: array
        items:
          type: integer
      member_state:
        type: integer
      unseen_conversation_count:
        type: integer
