---
properties:
  success:
    type: boolean
    description: Indicates if the request was successful
    example: true
  data:
    type: object
    properties:
      access_token:
        type: string
        description: JWT access token
        example: "eyJhbGciOiJIUzI1NiIsIn*****32yTqopVpa3ohvzHp_wqj9OWF2c"
      refresh_token:
        type: string
        description: JWT refresh token
        example: "eyJhbGciOiJIUzI1N*****n2Tb73nPKj4wlysQ_cNB96v7YQfVJg0"
      community:
        $ref: "./partials/community.yaml"
      user:
        $ref: "./partials/user.yaml"
      widgets:
        type: array
        items:
          $ref: "./partials/widget.yaml"
      app_access:
        type: boolean
        description: Indicates if app access is granted
        example: true
      has_answers:
        type: boolean
        description: Indicates if answers are present
        example: true
