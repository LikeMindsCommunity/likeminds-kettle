---
type: object
properties:
  success:
    type: boolean
    description: Whether the API request was successful
    example: true
  data:
    type: object
    description: Contains the main response payload
    properties:
      child_topics:
        type: array
        description: Child topics mapped by their parent IDs
        items:
          type: object
          properties:
            _id:
              type: string
              description: Topic ID
              example: "68aef47974eab106220f39b6"
            access:
              type: string
              description: Access level
              example: ""
            all_parent_ids:
              type: array
              description: List of all parent topic IDs this topic belongs to
              items:
                type: string
                example: "64d1fb340a7bda0ea462acea"
            is_enabled:
              type: boolean
              description: Whether the topic is enabled
              example: true
            is_searchable:
              type: boolean
              description: Whether the topic is searchable
              example: true
            level:
              type: integer
              description: Level of the topic in the hierarchy
              example: 1
            name:
              type: string
              description: Name of the topic
              example: "model 6"
            number_of_posts:
              type: integer
              description: Number of posts in the topic
              example: 0
            parent_id:
              type: string
              description: Parent topic ID
              example: "64d1fb340a7bda0ea462acea"
            parent_name:
              type: string
              description: Name of the parent topic
              example: "Airpods 1st gen"
            priority:
              type: integer
              description: Priority of the topic
              example: 0
            total_child_count:
              type: integer
              description: Total number of child topics
              example: 0
            widget_id:
              type: string
              description: Widget ID associated with the topic
              example: ""
      topics:
        type: array
        description: List of topics
        items:
          type: object
          properties:
            _id:
              type: string
              description: Topic ID
              example: "64d1fb340a7bda0ea462acea"
            access:
              type: string
              description: Access level
              example: ""
            all_parent_ids:
              type: array
              description: List of all parent topic IDs this topic belongs to
              items:
                type: string
              example: null
            is_enabled:
              type: boolean
              description: Whether the topic is enabled
              example: false
            is_searchable:
              type: boolean
              description: Whether the topic is searchable
              example: true
            level:
              type: integer
              description: Level of the topic in the hierarchy
              example: 0
            name:
              type: string
              description: Name of the topic
              example: "Airpods 1st gen"
            number_of_posts:
              type: integer
              description: Number of posts in the topic
              example: 0
            parent_id:
              type: string
              description: Parent topic ID
              example: ""
            parent_name:
              type: string
              description: Name of the parent topic
              example: ""
            priority:
              type: integer
              description: Priority of the topic
              example: 0
            total_child_count:
              type: integer
              description: Total number of child topics
              example: 1
            widget_id:
              type: string
              description: Widget ID associated with the topic
              example: ""
      widgets:
        type: object
        description: Mapping of widget IDs to widget names
        example: {}
