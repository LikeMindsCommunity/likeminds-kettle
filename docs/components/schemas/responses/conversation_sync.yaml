type: object
properties:
  success:
    type: boolean
  data:
    type: object
    properties:


      chatroom_reactions_meta:
        type: object
      
      community_meta:
        type: object
        properties:
          additional_properties:
            $ref: "./partials/community_meta.yaml"

      conv_attachments_meta:
        type: object
        description: Map of conversation ID to list of attachments metadata
        additionalProperties:
          type: array
          items:
            $ref: "./partials/conversation_attachments_meta.yaml"

      conv_polls_meta:
        type: object
        
      conv_reactions_meta:
        type: object

      conversations_data:
        type: array
        items:
          type: object
          properties:
            allow_add_option:
              type: boolean
            answer:
              type: string
            api_version:
              type: integer
            attachment_count:
              type: integer
            attachments_uploaded:
              type: boolean
            card_id:
              type: integer
            co_hosts:
              type: string
            community_id:
              type: integer
            created_at:
              type: string
            created_epoch:
              type: integer
            date:
              type: string
            deleted_by_user_id:
              type: integer
            device_id:
              type: integer
            end_time:
              type: integer
            expiry_time:
              type: integer
            has_files:
              type: boolean
            has_reactions:
              type: boolean
            header:
              type: string
            id:
              type: integer
            internal_link:
              type: string
            is_anonymous:
              type: boolean
            is_edited:
              type: boolean
            last_updated:
              type: integer
            location:
              type: string
            location_lat:
              type: integer
            location_long:
              type: integer
            multiple_select_no:
              type: integer
            multiple_select_state:
              type: string
            og_tags:
              type: string
            online_link_enable_before:
              type: integer
            poll_answer_text:
              type: string
            poll_type:
              type: string
            poll_type_text:
              type: string
            preview_chatroom_id:
              type: integer
            preview_community_id:
              type: integer
            preview_type:
              type: string
            reply_chatroom_id:
              type: integer
            reply_id:
              type: integer
            start_time:
              type: integer
            state:
              type: integer
            submit_type_text:
              type: string
            temporary_id:
              type: integer
            to_show_results:
              type: boolean
            user_id:
              type: integer
            
      user_meta:
        type: object
        description: Map of user id to user metadata
        additionalProperties:
          $ref: "./partials/user.yaml"

      widgets:
        type: object
        description: Map of widget id to widget metadata
        additionalProperties:
          ref: "./partials/widget.yaml"


