type: object
properties:
  success:
    type: boolean
  error_message:
    type: string
  data:
    type: object
    properties:
      total_likes:
        type: integer
      likes:
        type: array
        items:
          type: object
          properties:
            _id:
              type: string
            created_at:
              type: integer
            updated_at:
              type: integer
            user:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                image_url:
                  type: string
                user_unique_id:
                  type: string
                is_guest:
                  type: boolean
