            cohort_access:
              type: integer
            placeholder:
              type: string
            participant_count:
              type: integer
      channel_actions:
        type: object
        properties:
          "<channel_id>":
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                title:
                  type: string
