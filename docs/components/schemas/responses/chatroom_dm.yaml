type: object
properties:
  success:
    type: boolean
  data:
    type: object
    properties:
      dm_chatrooms:
        type: array
        items:
          type: object
          properties:
            chatroom:
              $ref: "./partials/chatroom.yaml"
            community:
              $ref: "./partials/community.yaml"
