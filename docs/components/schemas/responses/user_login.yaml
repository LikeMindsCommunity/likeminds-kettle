type: object
properties:
  success:
    type: boolean
  data:
    type: object
    properties:
      access:
        type: boolean
      access_token:
        type: string
      email_exists:
        type: boolean
      refresh_token:
        type: string
      existing_user:
        type: boolean
      user:
        type: object
        properties:
          id:
            type: integer
          image_url:
            type: string
          name:
            type: string
          is_guest:
            type: boolean
          organisation_name:
            type: string
          user_unique_id:
            type: string
          emails:
            type: array
            items:
              type: object
              properties:
                email:
                  type: string
                id:
                  type: integer
                state:
                  type: integer
                user_id:
                  type: integer
                verified:
                  type: boolean
          mobiles:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                mobile_no:
                  type: integer
                country_code:
                  type: integer
                state:
                  type: integer
                user_id:
                  type: integer
