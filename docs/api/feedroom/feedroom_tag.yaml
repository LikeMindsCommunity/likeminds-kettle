get:
  summary: Get Feedroom Tags

  operationId: getFeedroomTags

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - name: feedroom_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  group_tags:
                    type: array
                    items: {}
                  members:
                    $ref: "../../components/schemas/responses/members.yaml"
                  participants: {}
