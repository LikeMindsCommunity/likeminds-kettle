get:
  summary: Get My Feedrooms

  operationId: getMyFeedrooms

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  my_chatrooms:
                    type: array
                    items:
                      type: object
                      properties:
                        chatroom:
                          $ref: "../../components/schemas/responses/chatroom.yaml"
                        community:
                          $ref: "../../components/schemas/responses/community.yaml"
                        conversation_users: {}
                        is_draft: {}
                        last_conversation_time: {}
                        member_right_states: {}
                        member_state: {}
                        unseen_conversation_count: {}
                total_pages: {}
                total_unseen_count: {}
