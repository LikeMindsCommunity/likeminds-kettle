get:
  summary: Fetch chatroom of a community

  operationId: fetchChatroomOfCommunity

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/feedroomId.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                    properties:
                      access:
                        type: null
                      access_without_subscription:
                        type: boolean
                      answer_text:
                        type: string
                      answers_count:
                        type: integer
                      attachment_count:
                        type: integer
                      attachments_uploaded:
                        type: boolean
                      attended:
                        type: boolean
                      attending_count:
                        type: integer
                      attending_status:
                        type: boolean
                      audio_count:
                        type: integer
                      auto_follow_done:
                        type: boolean
                      card_creation_time:
                        type: string
                      chat_request_created_at:
                        type: null
                      chat_request_state:
                        type: null
                      chat_requested_by:
                        type: null
                      co_hosts:
                        type: array
                        items:
                          type: null
                      cohorts:
                        type: array
                        items:
                          type: null
                      community_id:
                        type: integer
                      community_name:
                        type: string
                      created_at:
                        type: string
                      date:
                        type: string
                      date_epoch:
                        type: integer
                      date_time:
                        type: integer
                      duration:
                        type: integer
                      external_seen:
                        type: boolean
                      follow_status:
                        type: boolean
                      header:
                        type: string
                      id:
                        type: integer
                      image_count:
                        type: integer
                      include_members_later:
                        type: boolean
                      is_edited:
                        type: boolean
                      is_guest:
                        type: boolean
                      is_paid:
                        type: boolean
                      is_pending:
                        type: boolean
                      is_pinned:
                        type: boolean
                      is_private:
                        type: boolean
                      is_private_member:
                        type: boolean
                      is_secret:
                        type: boolean
                      is_tagged:
                        type: boolean
                      member:
                        type: object
                        properties:
                          community_id:
                            type: integer
                          created_at:
                            type: integer
                          id:
                            type: integer
                          image_url:
                            type: string
                          is_guest:
                            type: boolean
                          is_owner:
                            type: boolean
                          member_since:
                            type: string
                          name:
                            type: string
                          route:
                            type: string
                          state:
                            type: integer
                          user_unique_id:
                            type: string
                      member_can_message:
                        type: boolean
                      mute_status:
                        type: boolean
                      online_link_enable_before:
                        type: integer
                      online_link_type:
                        type: null
                      participants_count:
                        type: integer
                      pdf_count:
                        type: integer
                      polls_count:
                        type: integer
                      reactions:
                        type: array
                        items:
                          type: null
                      share_link:
                        type: string
                      state:
                        type: integer
                      third_party_unique_id:
                        type: null
                      title:
                        type: string
                      total_response_count:
                        type: integer
                      type:
                        type: integer
                      video_count:
                        type: integer
                  chatrooms:
                    type: array
                    items:
                      type: object

