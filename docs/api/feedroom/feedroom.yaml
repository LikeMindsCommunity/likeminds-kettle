get:
  summary: Fetch chatroom of a community

  operationId: fetchChatroomOfCommunity

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/feedroomId.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatroom:
                    $ref: "../../components/schemas/responses/chatroom.yaml"
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../components/schemas/responses/chatroom.yaml"

post:
  summary: Create Chatroom

  operationId: createChatroom

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            is_secret:
              type: boolean
            title:
              type: string
            feedroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatroom:
                    $ref: "../../components/schemas/responses/chatroom.yaml"


put:
  summary: Update Chatroom

  operationId: updateChatroom

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            header:
              type: string
            title:
              type: string
            feedroom_id:
              type: integer
            feedroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean


delete:
  summary: Delete Chatroom

  operationId: deleteChatroom

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            feedroom_id:
              type: integer
            tag_id:
              type: integer
            reason:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
