put:
  summary: Update Chatroom

  operationId: updateChatroom

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            header:
              type: string
            title:
              type: string
            feedroom_id:
              type: integer
            feedroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean


delete:
  summary: Delete Chatroom

  operationId: deleteChatroom

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            feedroom_id:
              type: integer
            tag_id:
              type: integer
            reason:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
