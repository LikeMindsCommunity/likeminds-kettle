put:
  summary: Auto Join Members in Chatroom

  operationId: autoJoinMembers

  tags:
    - Feedroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            feedroom_id:
              type: integer
            auto_follow_done:
              type: boolean
            include_members_later:
              type: boolean

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
