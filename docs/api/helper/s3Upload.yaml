post:
    operationId: uploadFilesToS3  
    summary: Upload files to S3

    tags:
    - Helpers

    description: This API uploads files from Google Drive to Likemind's S3 platform and returns public S3 URLs for each file. A maximum of 10 files, each up to 100MB, can be uploaded per request.

    security:
      - bearerAuth: []
  
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              source:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  gdrive: ["drive_url 1", "drive_url 2"]
              category:
                type: string
                enum: [feed]
              entity:
                type: string
                enum: [post, widget]
            required: [source, category, entity]
    
    responses:
      '200':
        description: Successful operation
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  source_url:
                    type: string
                  s3_url:
                    type: string
                  error:
                    type: string
      '400':
        description: User not authorized or community on free tier
