post:
  operationId: uploadMediaUrl
  summary: Fetch Moderation Rights

  tags:
    - Helpers

  description: This API fetches Moderation rights for a user

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            conversation_id:
              type: string
            url:
              type: string
              format: uri
            type:
              type: string
            files_count:
              type: integer
            thumnail_url:
              type: string
            index:
              type: integer
            meta:
              type: object
              properties:
                size:
                  type: integer
                number_of_page:
                  type: integer
            name:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
