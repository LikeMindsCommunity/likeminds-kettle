get:
  operationId: getBots
  description:
    APIs for Fetching Bot details for a SDK Project
  tags: 
    - Bot
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/authToken.yaml"

  summary: Fetch all bot details
  responses:
    '200':
      description: Bot details retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  access:
                    type: boolean
                  email_exists:
                    type: boolean
                  existing_user:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      image_url:
                        type: string
                      is_guest:
                        type: boolean
                      name:
                        type: string
                      organisation_name:
                        type: null or string
                      user_unique_id:
                        type: string
