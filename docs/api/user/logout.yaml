post:
    operationId: logoutUser
    description: This API logs out the user and expires the authorization and refresh tokens
    tags:
      - Login
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/requests/user_logout.yaml"
            required:
              - refresh_token

    responses:
      '200':
        description: User logged out successfully
        content:
          application/json:
            schema:
              $ref: "../../components/schemas/responses/user_logout.yaml"
