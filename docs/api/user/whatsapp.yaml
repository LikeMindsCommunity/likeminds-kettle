post:
  summary: User Subscription WhatsApp

  operationId: userSubscriptionWhatsApp

  tags:
    - User

  security:
    - bearerAuth: []

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/user_whatsapp.yaml"
        required:
          - id
          - created
          - whatsappMessageId
          - conversationId
          - ticketId
          - text
          - type
          - timestamp
          - owner
          - eventType
          - statusString
          - waId
          - senderName

  responses:
    "200":
      description: OK
