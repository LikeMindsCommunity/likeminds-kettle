get:
  summary: User OTP Verify

  operationId: userOTPVerify

  tags:
    - User

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - name: otp_mode
      in: query
      description: OTP Mode
      required: true
      schema:
        type: string
    - name: mobile_no
      in: query
      description: Mobile Number
      required: true
      schema:
        type: integer
    - name: country_code
      in: query
      description: Country Code
      required: true
      schema:
        type: integer
    - name: otp
      in: query
      description: OTP
      required: true
      schema:
        type: string
    - name: email_id
      in: query
      description: Email ID
      schema:
        type: string
      required: false

  responses:
    "200":
      description: OK
