get:
  summary: Search Chatrooms
  operationId: searchChatrooms
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/search.yaml"
    - $ref: "../../components/parameters/query/searchType.yaml"
    - $ref: "../../components/parameters/query/followStatus.yaml"
    - $ref: "../../components/parameters/query/page.yaml"
    - $ref: "../../components/parameters/query/pageSize.yaml"
  description: 
    This API searches chatrooms in a community based on search term.

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
              data:
                type: object
                properties:
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../components/schemas/responses/chatroom.yaml"
