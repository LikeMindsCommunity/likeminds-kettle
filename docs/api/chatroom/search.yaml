get:
  summary: Search Chatrooms
  operationId: searchChatrooms
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/search.yaml"
    - $ref: "../../components/parameters/query/searchType.yaml"
    - $ref: "../../components/parameters/query/followStatus.yaml"
    - $ref: "../../components/parameters/query/page.yaml"
    - $ref: "../../components/parameters/query/pageSize.yaml"
  description: 
    This API searches chatrooms in a community based on search term.

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
              data:
                type: object
                properties:
                  chatrooms:
                    type: array
                    items:
                      type: object
                      properties:
                        attachments:
                          type: array
                          items:
                            type: object
                            properties:
                              index:
                                type: integer
                              type:
                                type: string
                              url:
                                type: string
                        attending_status:
                          type: boolean
                        chatroom:
                          type: object
                          properties:
                            attachment_count:
                              type: integer
                            attachments_uploaded:
                              type: boolean
                            audio_count:
                              type: integer
                            chatroom_with_user:
                              type: object
                            created_at:
                              type: integer
                            device_id:
                              type: null
                            header:
                              type: string
                            id:
                              type: integer
                            image_count:
                              type: integer
                            is_deleted:
                              type: boolean
                            is_pending:
                              type: boolean
                            is_pinned:
                              type: boolean
                            is_private:
                              type: boolean
                            is_secret:
                              type: boolean
                            pdf_count:
                              type: integer
                            platform:
                              type: null
                            title:
                              type: string
                            type:
                              type: integer
                            video_count:
                              type: integer
                        community:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        follow_status:
                          type: boolean
                        id:
                          type: integer
                        is_guest:
                          type: boolean
                        is_tagged:
                          type: boolean
                        member:
                          type: object
                          properties:
                            id:
                              type: integer
                            profile:
                              type: object
                              properties:
                                name:
                                  type: string
                        mute_status:
                          type: boolean
                        secret_chatroom_left:
                          type: boolean
                        state:
                          type: integer
                        updated_at:
                          type: integer
