post:
  summary: Add Participants to Chatroom

  operationId: addParticipantsToChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/authToken.yaml"
    
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_participants.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object


get:
  summary: Get Chatroom Participants

  operationId: getChatroomParticipants

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/isSecret.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/chatroom_participants.yaml"
