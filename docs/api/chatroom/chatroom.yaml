get:
  summary: Fetch Chatrooms of a Community

  operationId: getChatrooms

  tags:
    - Chatroom

  description: |
    This API fetches chatrooms of a community.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../components/schemas/responses/chatroom.yaml"


post:
  summary: Create Chatroom

  operationId: createChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              type: integer
            is_secret:
              type: boolean
            secret_chatroom_participants:
              type: array
              items:
                type: integer
            title:
              type: string
            chatroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object


put:
  summary: Update Chatroom

  operationId: updateChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            header:
              type: string
            title:
              type: string
            chatroom_id:
              type: integer
            chatroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean


delete:
  summary: Delete Chatroom

  operationId: deleteChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            tag_id:
              type: integer
            reason:
              type: string
          required:
            - chatroom_id
            - tag_id
            - reason

    responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    "404":
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
