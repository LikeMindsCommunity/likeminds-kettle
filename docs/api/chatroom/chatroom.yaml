get:
  operationId: getChatrooms
  tags:
    - Chatroom

  summary: Fetch Chatrooms of a Community
  description: This API fetches chatrooms of a community or a single chatroom (if chatroom_id is passed in query parameters)

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatroom:
                    $ref: "../../components/schemas/responses/partials/chatroom.yaml"
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../components/schemas/responses/partials/chatroom.yaml"
                  widgets:
                    type: array
                    items:
                      $ref: "../../components/schemas/responses/partials/widget.yaml"


post:
  operationId: createChatroom
  tags:
    - Chatroom
  
  summary: Create Chatroom
  description: This API creates a chatroom in a community (Admin only)

  security:
    - bearerAuth: []

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_create.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object


put:

  operationId: updateChatroom
  tags:
    - Chatroom

  summary: Update Chatroom
  description: This API updates a chatroom in a community (Admin only)

  security:
    - bearerAuth: []

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_update.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean


delete:
  operationId: deleteChatroom
  tags:
    - Chatroom

  summary: Delete Chatroom
  description: This API deletes a chatroom in a community (Admin only)

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_delete.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    "404":
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
