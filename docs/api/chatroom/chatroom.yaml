get:
  summary: Fetch Chatrooms of a Community

  operationId: getChatrooms

  tags:
    - Chatroom

  description: |
    This API fetches chatrooms of a community.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatrooms:
                    type: array
                    items:
                      type: object
                      properties:
                        access_without_subscription:
                          type: boolean
                        attachment_count:
                          type: integer
                        attachments:
                          type: array
                          items: []
                        attachments_uploaded:
                          type: boolean
                        attended:
                          type: boolean
                        attending_count:
                          type: integer
                        attending_status:
                          type: boolean
                        audio_count:
                          type: integer
                        audios:
                          type: array
                          items: []
                        auto_follow_done:
                          type: boolean
                        card_creation_time:
                          type: string
                        chatroom_category:
                          type: string
                        cohorts:
                          type: array
                          items: []
                        community_id:
                          type: integer
                        community_name:
                          type: string
                        created_at:
                          type: string
                        date:
                          type: string
                        date_epoch:
                          type: integer
                        date_time:
                          type: integer
                        follow_status:
                          type: boolean
                        has_been_named:
                          type: boolean
                        has_event_recording:
                          type: boolean
                        header:
                          type: string
                        id:
                          type: integer
                        image_count:
                          type: integer
                        images:
                          type: array
                          items: []
                        include_members_later:
                          type: boolean
                        is_edited:
                          type: boolean
                        is_guest:
                          type: boolean
                        is_paid:
                          type: boolean
                        is_pending:
                          type: boolean
                        is_private:
                          type: boolean
                        is_secret:
                          type: boolean
                        is_tagged:
                          type: boolean
                        member_can_message:
                          type: boolean
                        member_id:
                          type: integer
                        mute_status:
                          type: boolean
                        online_link_enable_before:
                          type: integer
                        participants_count:
                          type: integer
                        pdf:
                          type: array
                          items: []
                        pdf_count:
                          type: integer
                        polls_count:
                          type: integer
                        state:
                          type: integer
                        title:
                          type: string
                        type:
                          type: integer
                        unread_messages:
                          type: integer
                        video_count:
                          type: integer
                        videos:
                          type: array
                          items: []


post:
  summary: Create Chatroom

  operationId: createChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              type: integer
            is_secret:
              type: boolean
            secret_chatroom_participants:
              type: array
              items:
                type: integer
            title:
              type: string
            chatroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object


put:
  summary: Update Chatroom

  operationId: updateChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            header:
              type: string
            title:
              type: string
            chatroom_id:
              type: integer
            chatroom_image_url:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean


delete:
  summary: Delete Chatroom

  operationId: deleteChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            tag_id:
              type: integer
            reason:
              type: string
          required:
            - chatroom_id
            - tag_id
            - reason

    responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    "404":
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
