get:
  summary: Get My Chatrooms
  operationId: getMyChatrooms
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/query/page.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/chatroom_mine.yaml"

    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
