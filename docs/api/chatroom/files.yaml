put:
  summary: Upload Chatroom Files

  operationId: uploadChatroomFiles

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            attachments:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                  index:
                    type: integer
                  type:
                    type: string
                  height:
                    type: integer
                  width:
                    type: integer

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              chatroom:
                $ref: "../../components/schemas/responses/chatroom.yaml"
              success:
                type: boolean
