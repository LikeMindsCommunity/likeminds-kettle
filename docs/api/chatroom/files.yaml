put:
  summary: Upload Chatroom Files

  operationId: uploadChatroomFiles

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - name: chatroom_id
      in: query
      required: true
      schema:
        type: integer
      description: ID of the chatroom to upload files

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            attachments:
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                  index:
                    type: integer
                  type:
                    type: string
                  height:
                    type: integer
                  width:
                    type: integer

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              chatroom:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  community_id:
                    type: integer
                  answer_text:
                    type: string
                  share_link:
                    type: string
                  image_count:
                    type: integer
                  pdf_count:
                    type: integer
                  video_count:
                    type: integer
                  audio_count:
                    type: integer
                  attachment_count:
                    type: integer
                  attachments_uploaded:
                    type: boolean
                  type:
                    type: integer
                  date_time:
                    type: integer
                  duration:
                    type: integer
                  is_pending:
                    type: boolean
                  is_secret:
                    type: boolean
                  answers_count:
                    type: integer
                  attending_count:
                    type: integer
                  polls_count:
                    type: integer
                  date_epoch:
                    type: integer
                  header:
                    type: string
                  date:
                    type: string
                  created_at:
                    type: string
                  card_creation_time:
                    type: string
                  auto_follow_done:
                    type: boolean
                  is_edited:
                    type: boolean
                  is_paid:
                    type: boolean
                  access:
                    type: integer
                  online_link_enable_before:
                    type: integer
                  end_date:
                    type: integer
                  reactions:
                    type: array
                    items:
                      type: string
                  community_name:
                    type: string
                  has_been_named:
                    type: boolean
                  member_id:
                    type: integer
                  images:
                    type: array
                    items:
                      type: object
