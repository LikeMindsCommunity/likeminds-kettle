get:
  summary: Get Pending Chatrooms
  operationId: getPendingChatrooms
  tags:
    - Chatroom
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              chatrooms:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    community_id:
                      type: integer
                    answer_text:
                      type: string
                    share_link:
                      type: string
                    image_count:
                      type: integer
                    pdf_count:
                      type: integer
                    video_count:
                      type: integer
                    audio_count:
                      type: integer
                    type:
                      type: integer
                    date_time:
                      type: integer
                    duration:
                      type: integer
                    is_pending:
                      type: boolean
                    answers_count:
                      type: integer
                    attending_count:
                      type: integer
                    polls_count:
                      type: integer
                    card_creation_time:
                      type: string
                    community_name:
                      type: string
                    date:
                      type: string
                    created_at:
                      type: string
                    date_epoch:
                      type: integer
                    image_url_round:
                      type: string
                    polls:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          text:
                            type: string
                          is_selected:
                            type: boolean
                          poll_count:
                            type: integer
                          no_votes:
                            type: integer
                          percentage:
                            type: integer
                          member:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              image_url:
                                type: string
                    expiry_time:
                      type: integer
                    multiple_select_no:
                      type: integer
                    multiple_select_state:
                      type: integer
                    is_anonymous:
                      type: boolean
                    allow_add_option:
                      type: boolean
                    poll_type:
                      type: integer
                    poll_type_text:
                      type: string
                    submit_type_text:
                      type: string
                    end_date:
                      type: integer
                    header:
                      type: string
                    share_url:
                      type: string
                    creator_share_url:
                      type: string
                    link_created_at:
                      type: string
                    chatroom_category:
                      type: string
                    state:
                      type: integer
                    mute_status:
                      type: boolean
                    follow_status:
                      type: boolean
                    attending_status:
                      type: boolean
                    is_guest:
                      type: boolean
                    active:
                      type: boolean
                    is_tagged:
                      type: boolean
                    member:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        image_url:
                          type: string
                        question_answers:
                          type: array
                          items:
                            type: object
                            properties:
                              community_id:
                                type: integer
                              member_id:
                                type: integer
                              question_title:
                                type: string
                              value:
                                type: string
                              question_id:
                                type: integer
                              state:
                                type: integer
                              is_hidden:
                                type: boolean
                              directory_fields:
                                type: boolean
                          state:
                            type: integer
                          is_owner:
                            type: boolean
                          route:
                            type: string
                          member_since:
                            type: string
                          community_id:
                            type: integer
                    images:
                      type: array
                      items:
                        type: object
                    pdf:
                      type: array
                      items:
                        type: object
                    audios:
                      type: array
                      items:
                        type: object
                    videos:
                      type: array
                      items:
                        type: object
              success:
                type: boolean


put:
  summary: Update Pending Chatroom
  operationId: updatePendingChatroom
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - name: Authorization
      in: header
      description: Authorization token
      schema:
        type: string
    - name: x-api-key
      in: header
      description: API Key
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: integer
            value:
              type: boolean
            pre-approve:
              type: boolean
          required:
            - chatroom_id
            - value
            - pre-approve
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
