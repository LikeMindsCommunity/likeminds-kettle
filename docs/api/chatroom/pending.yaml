get:
  summary: Get Pending Chatrooms
  operationId: getPendingChatrooms
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              chatrooms:
                type: array
                items:
                  $ref: "../../components/schemas/responses/chatroom.yaml"
              success:
                type: boolean


put:
  summary: Update Pending Chatroom
  operationId: updatePendingChatroom
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: integer
            value:
              type: boolean
            pre-approve:
              type: boolean
          required:
            - chatroom_id
            - value
            - pre-approve
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
