put:
  summary: Rename Chatroom
  operationId: renameChatroom
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_rename.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
          example:
            success: true
          description: Indicates whether the operation was successful.
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
          example:
            error: "Chatroom not found"
          description: Indicates that the specified chatroom was not found.
