put:
  summary: Enable Auto Follow Members in a Chatroom

  operationId: enableAutoFollowMembers

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/path/chatroomId.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            auto_follow_done:
              type: boolean
            include_members_later:
              type: boolean
          required:
            - auto_follow_done
            - include_members_later

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    "404":
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
