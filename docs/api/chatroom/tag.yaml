get:
  summary: Get Chatroom Tags

  operationId: getChatroomTags

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/searchName.yaml"
    - $ref: "../../components/parameters/query/isSecret.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        image_url:
                          type: string
                        is_guest:
                          type: boolean
                        name:
                          type: string
                        user_unique_id:
                          type: string
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        image_url:
                          type: string
                        is_guest:
                          type: boolean
                        name:
                          type: string
                        user_unique_id:
                          type: string