get:
  summary: Get Chatroom Tags

  operationId: getChatroomTags

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/searchName.yaml"
    - $ref: "../../components/parameters/query/isSecret.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  members:
                    $ref: "../../components/schemas/responses/members.yaml"
                  participants:
                    $ref: "../../components/schemas/responses/participants.yaml"