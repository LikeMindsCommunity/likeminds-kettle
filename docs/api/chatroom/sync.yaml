get:
  summary: Sync Chatrooms
  operationId: syncChatrooms
  tags:
    - Chatroom
  description: Retrieve synchronized chatrooms.
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/sdkSource.yaml"
    - $ref: "../../components/parameters/headers/apiVersion.yaml"
    - $ref: "../../components/parameters/query/page.yaml"
    - $ref: "../../components/parameters/query/pageSize.yaml"
    - $ref: "../../components/parameters/query/minTimestamp.yaml"
    - $ref: "../../components/parameters/query/maxTimestamp.yaml"
    - $ref: "../../components/parameters/query/chatroomTypes.yaml"
    - $ref: "../../components/parameters/query/isLocalDb.yaml"
    - $ref: "../../components/parameters/query/includedConversationStates.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/chatroom_sync.yaml"

    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
