put:
  summary: Update Chatroom Type

  operationId: updateChatroomType

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/path/chatroomId.yaml"

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            is_secret:
              type: boolean
          required:
            - is_secret

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
