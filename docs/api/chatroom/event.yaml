post:
  summary: Create Chatroom Event

  operationId: createChatroomEvent

  tags:
    - Chatroom

  description: This API creates a chatroom event for a community.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_event.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json: {}



get:
  summary: Get Chatroom Events

  operationId: getChatroomEvents

  tags:
    - Chatroom

  description: This API fetches chatroom events of a community.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/query/page.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                    nullable: true
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../components/schemas/responses/chatroom.yaml"
