post:
  summary: Block Chatroom

  operationId: blockChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/chatroom_block.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  conversation:
                    $ref: "../../components/schemas/responses/conversation.yaml"
