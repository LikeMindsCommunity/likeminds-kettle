post:
  summary: Block Chatroom

  operationId: blockChatroom

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: integer
              description: ID of the chatroom to block
            status:
              type: integer
              description: Block status (e.g., 1 for block)

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  conversation:
                    $ref: "../../components/schemas/responses/conversation.yaml"
