post:
  summary: Create Chatroom Event Recording

  operationId: createChatroomEventRecording

  tags:
    - Chatroom

  description: |
    This API creates a recording for a chatroom event in a community.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/requests/chatroom_recording_create.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                    nullable: true
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../../components/schemas/responses/chatroom.yaml"



delete:
  summary: Delete Chatroom Event Recording

  operationId: deleteChatroomEventRecording

  tags:
    - Chatroom

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"

  description: |
    This API deletes a recording from a chatroom event.

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/requests/chatroom_recording_delete.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../../components/schemas/responses/chatroom.yaml"
