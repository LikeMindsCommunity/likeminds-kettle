post:
  summary: Add FAQ to Chatroom Event

  operationId: addChatroomEventFAQ

  tags:
    - Chatroom

  description: |
    This API adds frequently asked questions (FAQ) to a chatroom event.

  security:
    - bearerAuth: []
        
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: string
            faq:
              type: array
              items:
                type: object
                properties:
                  chatroom_id:
                    type: string
                  question:
                    type: string
                  answer:
                    type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                  chatrooms:
                    type: array
                    items:
                      type: object
