get:
  summary: Get Unseen Count for Chatroom Event

  operationId: getChatroomEventUnseenCount

  tags:
    - Chatroom

  security:
    - bearerAuth: []
    
  description: |
    This API fetches the unseen count for a chatroom event.

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                  chatrooms:
                    type: array
                    items:
                      type: object
