post:
  summary: Add Testimonials to Chatroom Event

  operationId: addChatroomEventTestimonials

  tags:
    - Chatroom

  description: |
    This API adds testimonials to a chatroom event.

  requestBody:
    content:
      application/json:
        schema: {}

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  chatroom:
                    type: object
                  chatrooms:
                    type: array
                    items:
                      type: object
