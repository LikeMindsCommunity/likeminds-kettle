get:
  summary: Get Direct Message Chatrooms
  operationId: getDirectMessageChatrooms
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  dm_chatrooms:
                    type: array
                    items:
                      type: object
                      properties:
                        chatroom:
                          $ref: "../../components/schemas/responses/chatroom.yaml"
                        community:
                          $ref: "../../components/schemas/responses/chatroom.yaml"
                        is_draft:
                          type: boolean
                        is_private_member:
                          type: boolean
                        last_conversation:
                          $ref: "../../components/schemas/responses/lastConversation.yaml"
                        last_conversation_time:
                          type: string
                        member_right_states:
                          type: array
                          items:
                            type: integer
                        member_state:
                          type: integer
                        unseen_conversation_count:
                          type: integer
