put:
      summary: Follow/Unfollow Chatroom
      operationId: followChatroom
      tags:
        - Chatroom
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chatroom_id:
                  type: integer
                uuid:
                  type: string
                value:
                  type: boolean
              required:
                - chatroom_id
                - uuid
                - value
              example:
                chatroom_id: 72932
                uuid: "user_unique_id 2"
                value: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
              description: Indicates whether the operation was successful.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Chatroom not found"
              description: Indicates that the specified chatroom was not found.