post:
  summary: Create Direct Message Chatroom
  operationId: createDMChatroom
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/requests/dm_create.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatroom:
                    $ref: "../../../components/schemas/responses/chatroom.yaml"
                  chatroom_local:
                    type: object
                    properties:
                      access_without_subscription:
                        type: boolean
                      attachment_count:
                        type: integer
                      attachments:
                        type: array
                        items: {}
                      attachments_uploaded:
                        type: boolean
                      attended:
                        type: boolean
                      attending_count:
                        type: integer
                      attending_status:
                        type: boolean
                      audio_count:
                        type: integer
                      audios:
                        type: array
                        items: {}
                      auto_follow_done:
                        type: boolean
                      card_creation_time:
                        type: string
                      chatroom_category:
                        type: string
                      chatroom_with_user_id:
                        type: integer
                      cohorts:
                        type: array
                        items: {}
                      community_id:
                        type: integer
                      community_name:
                        type: string
                      created_at:
                        type: string
                      date:
                        type: string
                      date_epoch:
                        type: integer
                      date_time:
                        type: integer
                      follow_status:
                        type: boolean
                      has_been_named:
                        type: boolean
                      has_event_recording:
                        type: boolean
                      header:
                        type: string
                      id:
                        type: integer
                      image_count:
                        type: integer
                      images:
                        type: array
                        items: {}
                      include_members_later:
                        type: boolean
                      is_edited:
                        type: boolean
                      is_guest:
                        type: boolean
                      is_paid:
                        type: boolean
                      is_pending:
                        type: boolean
                      is_poll_anonymous:
                        type: boolean
                      is_private:
                        type: boolean
                      is_secret:
                        type: boolean
                      is_tagged:
                        type: boolean
                      member_can_message:
                        type: boolean
                      member_id:
                        type: integer
                      mute_status:
                        type: boolean
                      online_link_enable_before:
                        type: integer
                      pdf:
                        type: array
                        items: {}
                      pdf_count:
                        type: integer
                      polls_count:
                        type: integer
                      state:
                        type: integer
                      title:
                        type: string
                      type:
                        type: integer
                      unread_messages:
                        type: integer
                      video_count:
                        type: integer
                      videos:
                        type: array
                        items: {}
