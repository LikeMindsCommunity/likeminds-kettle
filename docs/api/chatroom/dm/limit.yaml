get:
  summary: Get DM Limit of a User
  operationId: getDMLimit
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/query/uuid.yaml"
    - $ref: "../../../components/parameters/query/memberId.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  chatroom_id:
                    type: integer
                  is_request_dm_limit_exceeded:
                    type: boolean
                  new_request_dm_timestamp:
                    type: string
