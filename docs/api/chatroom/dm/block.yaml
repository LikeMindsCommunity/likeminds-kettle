post:
  summary: Block Direct Message Chatroom
  operationId: blockDirectMessageChatroom
  tags:
    - Chatroom
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: integer
            status:
              type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  conversation:
                    $ref: "../../../components/schemas/responses/conversation.yaml"
