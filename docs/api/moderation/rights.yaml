get:
  summary: Fetch Moderation Rights

  operationId: getModetationRights

  tags:
    - Moderation

  description: This API fetches Moderation rights for a user

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/is_cm.yaml"
    - $ref: "../../components/parameters/query/user_id.yaml"
    - $ref: "../../components/parameters/query/uuid.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/moderation_rights_get.yaml"

put: 
  summary: Update Moderation Rights

  operationId: updateModetationRights

  tags:
    - Moderation

  description: This API updates Moderation rights for a user

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/is_cm.yaml"
    - $ref: "../../components/parameters/query/user_id.yaml"
    - $ref: "../../components/parameters/query/uuid.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/responses/moderation_rights_update.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean



patch: 
  summary: Modify Moderation Rights

  operationId: modifyModetationRights

  tags:
    - Moderation

  description: This API modifies Moderation rights for a user

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/is_cm.yaml"
    - $ref: "../../components/parameters/query/user_id.yaml"
    - $ref: "../../components/parameters/query/uuid.yaml"
  
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/responses/moderation_rights_modify.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
