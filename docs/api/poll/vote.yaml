put:
  summary: Vote on a poll

  operationId: voteOnPoll

  tags:
    - Poll

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/path/poll_id.yaml"

  requestBody:
    description: Votes on poll options
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/poll_vote.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean


get:
  summary: Get votes for a poll

  operationId: getPollVotes

  tags:
    - Poll

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/path/poll_id.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  votes:
                    type: array
                    items:
                      type: string
