get:
  summary: Search Channel

  operationId: searchChannel

  tags:
    - Search

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - name: search
      in: query
      description: keyword to search
      required: true
      schema:
        type: string
    - name: search_type
      in: query
      description: Search type
      required: true
      schema:
        type: string
      enum:
        - title
        # Add other possible values if applicable
    - name: page
      in: query
      description: page number
      required: true
      schema:
        type: integer
    - name: page_size
      in: query
      description: page size
      required: true
      schema:
        type: integer
    - name: follow_status
      in: query
      description: follow status
      required: true
      schema:
        type: boolean

  responses:
    "200":
      description: OK
