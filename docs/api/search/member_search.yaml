get:
  summary: Community Member Search

  operationId: communityMemberSearch

  tags:
    - Search

  security:
    - noauth: []
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - name: search
      in: query
      description: keyword to search
      required: true
      schema:
        type: string
    - name: search_type
      in: query
      description: Search type
      required: true
      schema:
        type: string
      enum:
        - name
        - tag
        - cohort_name
        - user_unique_id
        - client_user_unique_id
    - name: order_type
      in: query
      description: order type of search results
      required: false
      schema:
        type: string
      enum:
        - last_updated
        - Alphabetical
    - name: member_states
      in: query
      description: State of member to filter on
      required: false
      schema:
        type: array
        items:
          type: integer
    - name: page
      in: query
      description: page number
      required: false
      schema:
        type: integer
    - name: page_size
      in: query
      description: page size
      required: false
      schema:
        type: integer
    - name: question_answers_version
      in: query
      description: which question answers version to send
      required: false
      schema:
        type: string
      default: v1

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        custom_click_text:
                          type: string
                        custom_intro_text:
                          type: string
                        id:
                          type: integer
                        image_url:
                          type: string
                        is_owner:
                          type: boolean
                        member_cohorts:
                          type: array
                          items:
                            type: object
                            properties:
                              cohort_id:
                                type: integer
                              name:
                                type: string
                        name:
                          type: string
                        state:
                          type: integer
                        updated_at:
                          type: integer
