get:
  summary: Community Member Search

  operationId: communityMemberSearch

  tags:
    - Search

  security:
    - noauth: []
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/search.yaml"
    - $ref: "../../components/parameters/query/searchType.yaml"
    - $ref: "../../components/parameters/query/page.yaml"
    - $ref: "../../components/parameters/query/pageSize.yaml"
    - $ref: "../../components/parameters/query/orderType.yaml"
    - $ref: "../../components/parameters/query/questionAnswerVersions.yaml"
    - name: member_states
      in: query
      description: State of member to filter on
      required: false
      schema:
        type: array
        items:
          type: integer

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        custom_click_text:
                          type: string
                        custom_intro_text:
                          type: string
                        id:
                          type: integer
                        image_url:
                          type: string
                        is_owner:
                          type: boolean
                        member_cohorts:
                          type: array
                          items:
                            type: object
                            properties:
                              cohort_id:
                                type: integer
                              name:
                                type: string
                        name:
                          type: string
                        state:
                          type: integer
                        updated_at:
                          type: integer
