get:
  summary: Search Post

  operationId: searchPost

  tags:
    - Search

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - name: search
      in: query
      description: keyword to search
      required: true
      schema:
        type: string
    - name: search_type
      in: query
      description: Search type
      required: true
      schema:
        type: string
      enum:
        - text
        # Add other possible values if applicable
    - name: page
      in: query
      description: page number
      required: true
      schema:
        type: integer
    - name: page_size
      in: query
      description: page size
      required: true
      schema:
        type: integer
    - name: excluded_chatroom_ids
      in: query
      description: List of excluded chatroom IDs
      required: true
      schema:
        type: array
        items:
          type: string

  responses:
    "200":
      description: OK
