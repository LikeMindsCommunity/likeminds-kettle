
get:
  description: 
    This API fetches widgets based on Search criteria. Search query param is required field
  tags: 
    - Widget
  operationId: getWidgets
  summary: Get widgets based on search criteria
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - name: search_key
      in: query
      required: true
      schema:
        type: string
      example: "metadata.tags"
    - name: search_value
      in: query
      required: true
      schema:
        type: string
      example: "elastic"
  responses:
    '200':
      description: Widgets retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  widgets:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        _lm_meta:
                          type: string
                          nullable: true
                        created_at:
                          type: integer
                        metadata:
                          type: object
                          properties:
                            tags:
                              type: array
                              items:
                                oneOf:
                                  - type: string
                                  - type: array
                                    items:
                                      type: string
                        parent_entity_id:
                          type: string
                        parent_entity_type:
                          type: string
                        updated_at:
                          type: integer
          example:
            success: true
            data:
              widgets:
                - _id: "656e1689a80d7eb08f2456fa"
                  _lm_meta: "null"
                  created_at: 1701713545377
                  metadata:
                    tags:
                      - "elastic"
                      - ["search 2"]
                  parent_entity_id: "test_id"
                  parent_entity_type: "test_type"
                  updated_at: 1701713545377

post:
  operationId: createWidget
  description: This API creates a new custom widget 
  tags: 
    - Widget
  summary: Create a new widget
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            parent_entity_id:
              type: string
            parent_entity_type:
              type: string
            metadata:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
  responses:
    '200':
      description: Widget created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  widget:
                    type: object
                    properties:
                      _id:
                        type: string
                      _lm_meta:
                        type: string  # Adjust the type accordingly if you know the expected type
                      created_at:
                        type: integer
                      metadata:
                        type: object
                        properties:
                          tags:
                            type: array
                            items:
                              oneOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                      parent_entity_id:
                        type: string
                      parent_entity_type:
                        type: string
                      updated_at:
                        type: integer
          example:
            success: true
            data:
              widget:
                _id: "656e1689a80d7eb08f2456fa"
                _lm_meta: ""
                created_at: 1701713545377
                metadata:
                  tags:
                    - "elastic"
                    - ["search 2"]
                parent_entity_id: "test_id"
                parent_entity_type: "test_type"
                updated_at: 1701713545377
