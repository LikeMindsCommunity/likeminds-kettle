get:
  operationId: fetchWebhook
  summary: Get Webhook
  description: |
    This API fetches a single webhook using its ID.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:    
      - $ref: "../../components/parameters/headers/platformType.yaml"
      - $ref: "../../components/parameters/path/webhookId.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/webhookGet.yaml"


patch:
  operationId: updateWebhook
  summary: Update Webhook
  description: |
    This API is used to update a registered webhook.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/path/webhookId.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/webhookEdit.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/webhookEdit.yaml"


delete:
  operationId: deleteWebhook
  summary: Delete Webhook
  description: |
    This API is used to delete a registered webhook.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/path/webhookId.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          example:
            success: true
