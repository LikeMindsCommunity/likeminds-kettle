post:
  summary: Create SDK Project

  operationId: createSdkProject

  tags:
    - Project

  description: This API creates SDK Project for client.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/project.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  api_key:
                    type: string

get:
  summary: Fetch SDK Projects

  operationId: getSdkProjects

  tags:
    - Project

  description: This API fetches SDK Projects for client.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        api_key:
                          type: string
                        community:
                          $ref: "../../components/schemas/responses/community.yaml"
                        firebase_server_key:
                          type: string
                        is_join_form_enabled:
                          type: boolean

put:
  summary: Update SDK Project

  operationId: editSdkProjects

  tags:
    - Project

  description: This API updates SDK Project for client.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/project.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean

delete:
  summary: Deletes SDK Project

  operationId: deleteSdkProjects

  tags:
    - Project

  description: This API deletes SDK Project for client.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
