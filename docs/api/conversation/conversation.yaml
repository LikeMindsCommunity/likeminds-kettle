get:
  operationId: getConversations
  tags:
    - Conversation

  summary: Get Conversations
  description: This API enables you to get all conversations (messages) inside a chatroom.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/conversationId.yaml"
    - $ref: "../../components/parameters/query/scroll_direction.yaml"
    - $ref: "../../components/parameters/query/paginate_by.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/conversation_get.yaml"



post:
  summary: Create Conversation
  operationId: createConversation
  description: This API enables you to create new conversations (message) inside a chatroom.
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/apiVersion.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/conversation_create.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/conversation_create.yaml"



