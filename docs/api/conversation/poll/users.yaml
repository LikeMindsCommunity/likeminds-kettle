get:
  summary: Get Users who Voted in a Poll
  operationId: getPollUsers
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - name: Authorization
      in: header
      description: JWT token
      schema:
        type: string
    - name: x-api-key
      in: header
      description: API Key
      schema:
        type: string
    - name: conversation_id
      in: query
      description: ID of the conversation
      required: true
      schema:
        type: integer
    - name: poll_id
      in: query
      description: ID of the poll
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
              member:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    state:
                      type: integer
                    is_owner:
                      type: boolean
                    community_id:
                      type: integer
                    route:
                      type: string
                    created_at:
                      type: integer
                    member_since:
                      type: string
                    image_url:
                      type: string
                    question_answer:
                      type: object
                      properties:
                        member_id:
                          type: integer
                        community_id:
                          type: integer
                        state:
                          type: integer
                        value:
                          type: string
                        question_id:
                          type: integer
                        is_hidden:
                          type: boolean
                        directory_fields:
                          type: boolean
