post:
  summary: Submit Poll in Conversation
  operationId: submitPollInConversation
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            conversation_id:
              type: integer
            polls:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
