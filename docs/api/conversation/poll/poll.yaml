post:
  summary: Create Poll in Conversation
  operationId: createPollInConversation
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            poll:
              type: object
              properties:
                text:
                  type: string
            conversation_id:
              type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  poll:
                    type: object
                    properties:
                      id:
                        type: integer
                      text:
                        type: string
                      user_id:
                        type: integer



