put:
  summary: Mark Event as Attended
  operationId: markEventAttended
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            conversation_id:
              type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean