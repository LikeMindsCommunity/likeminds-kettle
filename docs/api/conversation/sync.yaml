get:
  summary: Synchronize Conversations
  operationId: synchronizeConversations
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"
    - $ref: "../../components/parameters/query/page.yaml"
    - $ref: "../../components/parameters/query/pageSize.yaml"
    - $ref: "../../components/parameters/query/minTimestamp.yaml"
    - $ref: "../../components/parameters/query/maxTimestamp.yaml"
    - $ref: "../../components/parameters/query/orderBy.yaml"
    - name: excluded_conversation_states
      in: query
      description: Excluded conversation states
      schema:
        type: array
        items:
          type: integer
      required: false
    - name: conversation_id
      in: query
      description: Specific conversation ID
      schema:
        type: string
      required: false
    - name: is_local_db
      in: query
      description: Whether to use local database
      schema:
        type: boolean
      required: false
      
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/conversation_sync.yaml"
