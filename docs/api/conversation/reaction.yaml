put:
  summary: Add Reaction to Conversation
  operationId: addReactionToConversation
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/conversation_reaction_add.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean



delete:
  summary: Remove Reaction from Conversation
  operationId: removeReactionFromConversation
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/conversation_reaction_add.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
