put:
  summary: Add Reaction to Conversation
  operationId: addReactionToConversation
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: integer
              description: Chtatroom id is nullable
            reaction:
              type: string
              description: any string
            conversation_id:
              type: integer
              description: Conversation id is nullable
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean



delete:
  summary: Remove Reaction from Conversation
  operationId: removeReactionFromConversation
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            chatroom_id:
              type: integer
            conversation_id:
              type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
