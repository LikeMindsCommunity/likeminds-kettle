get:
  summary: Get Unread Conversations
  operationId: getUnreadConversations
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../../components/parameters/query/chatroomId.yaml"
    - name: paginate_by
      in: query
      description: Items per page for pagination
      schema:
        type: integer
    - $ref: "../../../components/parameters/query/page.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  conversations:
                    type: array
                    items: {}