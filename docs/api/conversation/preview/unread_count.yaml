get:
  summary: Get Unread Conversations Count
  operationId: getUnreadConversationsCount
  tags:
    - Conversation
  security:
    - bearerAuth: []
  parameters:
    - name: Authorization
      in: header
      description: JWT token
      schema:
        type: string
    - name: x-api-key
      in: header
      description: API Key
      schema:
        type: string
    - name: chatroom_id
      in: query
      description: Chatroom ID
      schema:
        type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  count:
                    type: integer
