get:
    operationId: generateOTP
    description: This API generates OTP
    tags:
      - Login
    security:
      - bearer_token: []
    parameters:
      - $ref: "../../components/parameters/headers/authToken.yaml"
      - $ref: "../../components/parameters/query/countryCode.yaml"
      - $ref: "../../components/parameters/query/mobileNumber.yaml"

    responses:
      '200':
        description: OTP generated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                error_message:
                  type: string