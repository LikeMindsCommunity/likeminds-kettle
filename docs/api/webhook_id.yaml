get:
  summary: Get Webhook
  description: |
    This API fetches a single webhook using its ID.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - $ref: "../components/parameters/path/webhook_id.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/webhook_get.yaml"

patch:
  summary: Edit Webhook
  description: |
    This API is used to edit a webhook present in the community.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - $ref: "../components/parameters/path/webhook_id.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/requests/webhook_edit.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "../components/schemas/responses/webhook_edit.yaml"


delete:
  summary: Delete Webhook
  description: |
    This API is used to delete a webhook present in the community.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - $ref: "../components/parameters/path/webhook_id.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          example:
            success: true
