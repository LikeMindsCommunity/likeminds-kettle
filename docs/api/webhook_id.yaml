get:
  summary: Get Webhook
  description: |
    This API fetches a single webhook using its ID.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - $ref: "../components/parameters/path/webhook_id.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          example:
            success: true
            data:
              webhook:
                community: 50453
                created_at: 1695111667877
                id: 14
                is_active: false
                updated_at: 1695111667877
                url: "https://eoja4x1itbjwnwc.m.pipedream.net"
                webhook_type: "chatroom.joined"


patch:
  summary: Edit Webhook
  description: |
    This API is used to edit a webhook present in the community.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - $ref: "../components/parameters/path/webhook_id.yaml"
  requestBody:
    required: true
    content:
      application/json:
        example:
          url: "https://eoja4x1itbjwnwc.m.pipedream.net"
          is_active: true
  responses:
    '200':
      description: OK
      content:
        application/json:
          example:
            success: true
            data:
              webhook:
                community: 50453
                created_at: 1695111667877
                id: 14
                is_active: true
                updated_at: 1695111739320
                url: "https://eoja4x1itbjwnwc.m.pipedream.net"
                webhook_type: "chatroom.joined"


delete:
  summary: Delete Webhook
  description: |
    This API is used to delete a webhook present in the community.
  tags:
    - Webhooks
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../components/parameters/headers/authToken.yaml"
    - $ref: "../components/parameters/path/webhook_id.yaml"
  responses:
    '200':
      description: OK
      content:
        application/json:
          example:
            success: true