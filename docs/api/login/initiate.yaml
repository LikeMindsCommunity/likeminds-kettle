post:
  operationId: sdkInitate
  tags:
    - Login
  summary: sdk/initiate
  description: This API creates or login the user based on details provided from sdk client
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/sdkSource.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: User Name
              nullable: true
            user_unique_id:
              type: string
              description: User Unique Id of user
              nullable: true
            is_guest:
              type: boolean
              description: If user is a guest user
              nullable: true
            image_url:
              type: string
              description: User Image Url
              nullable: true

  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              
              data:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      image_url:
                        type: string
                      name:
                        type: string
                      is_guest:
                        type: boolean
                      organisation_name:
                        type: string
                      user_unique_id:
                        type: string
                  community:
                    type: object
                    properties:
                      auto_approval:
                        type: boolean
                      branding:
                        type: object
                        # Add properties for branding if needed
                      fee_event:
                        type: integer
                      fee_membership:
                        type: integer
                      fee_payment_pages:
                        type: integer
                      grace_period:
                        type: integer
                      hide_dm_tab:
                        type: boolean
                      id:
                        type: integer
                      image_url:
                        type: string
                      is_discoverable:
                        type: boolean
                      is_freemium_community:
                        type: boolean
                      is_paid:
                        type: boolean
                      is_whitelabel:
                        type: boolean
                      members_count:
                        type: integer
                      name:
                        type: string
                      purpose:
                        type: string
                      referral_enabled:
                        type: boolean
                      type:
                        type: integer
                      sub_type:
                        type: integer
                      updated_at:
                        type: integer
                      whitelabel_info:
                        type: object
                        # Add properties for whitelabel_info if needed
                      community_setting_rights:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            state:
                              type: integer
                            title:
                              type: string
                            is_locked:
                              type: boolean
                            is_selected:
                              type: boolean
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
