get:
  summary: Get Channel Invites

  operationId: getChannelInvites

  tags:
    - Channel

  security:
    - bearerAuth: []

  parameters:
    - name: x-api-key
      in: header
      description: API key of community
      schema:
        type: string
    - name: x-platform-code
      in: header
      description: Platform Code
      schema:
        type: string
    - name: x-version-code
      in: header
      description: Version Code
      schema:
        type: string
    - name: channel_type
      in: query
      description: Channel Type
      schema:
        type: integer
    - name: page
      in: query
      description: Page number
      schema:
        type: integer
    - name: page_size
      in: query
      description: Page size
      schema:
        type: integer

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  user_invites:
                    type: array
                    items:
                      type: object
                      properties:
                        chatroom:
                          type: object
                          properties:
                            chatroom_image_url:
                              type: string
                            created_at:
                              type: integer
                            header:
                              type: string
                            id:
                              type: integer
                            is_secret:
                              type: boolean
                            title:
                              type: string
                            updated_at:
                              type: integer
                        created_at:
                          type: integer
                        id:
                          type: integer
                        invite_receiver:
                          type: object
                          properties:
                            id:
                              type: integer
                            image_link:
                              type: string
                            is_guest:
                              type: boolean
                            name:
                              type: string
                            user_unique_id:
                              type: string
                        invite_sender:
                          type: object
                          properties:
                            id:
                              type: integer
                            image_link:
                              type: string
                            is_guest:
                              type: boolean
                            name:
                              type: string
                            user_unique_id:
                              type: string
                        invite_status:
                          type: integer
                        updated_at:
                          type: integer
