put:
  summary: Accept or Reject Channel Invite

  operationId: acceptRejectChannelInvite

  tags:
    - Channel

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            channel_id:
              type: string
            invite_status:
              type: integer
          required:
            - channel_id
            - invite_status

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
