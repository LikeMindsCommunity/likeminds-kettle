get:
  summary: Get Channel Information

  operationId: getChannelInfo

  tags:
    - Channel

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            method:
              type: string
              default: GET
            url:
              type: object
              properties:
                raw:
                  type: string
                host:
                  type: array
                  items:
                    type: string
                path:
                  type: array
                  items:
                    type: string
                query:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      value:
                        type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  can_access_secret_chatroom:
                    type: boolean
                  chatroom:
                    $ref: "../../components/schemas/responses/chatroom.yaml"
                  chatroom_actions:
                    $ref: "../../components/schemas/responses/chatroomActions.yaml"
                  community:
                    $ref: "../../components/schemas/responses/community.yaml"
                  conversation_users:
                    type: array
                    items: {}
                  participant_count:
                    type: integer
                  unread_messages:
                    type: integer
