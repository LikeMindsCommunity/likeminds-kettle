get:
  summary: Get Channel Information

  operationId: getChannelInfo

  tags:
    - Channel

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/channel_info.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  can_access_secret_chatroom:
                    type: boolean
                  chatroom:
                    $ref: "../../components/schemas/responses/chatroom.yaml"
                  chatroom_actions:
                    $ref: "../../components/schemas/responses/chatroomActions.yaml"
                  community:
                    $ref: "../../components/schemas/responses/community.yaml"
                  conversation_users:
                    type: array
                    items: {}
                  participant_count:
                    type: integer
                  unread_messages:
                    type: integer
