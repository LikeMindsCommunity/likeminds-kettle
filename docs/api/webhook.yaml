get:
  operationId: getWebhooks
  description:
    This API fetches all the Webhook active for a community App
  tags: 
    - Webhooks
  security:
    - bearerAuth: []

  parameters:
    - $ref: "../components/parameters/headers/platformCode.yaml"
    - $ref: "../components/parameters/headers/apiKey.yaml"
  summary: Fetch all webhooks
  responses:
    '200':
      description: Webhooks retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      type: object
                      properties:
                        community:
                          type: integer
                        created_at:
                          type: integer
                        id:
                          type: integer
                        is_active:
                          type: boolean
                        updated_at:
                          type: integer
                        url:
                          type: string
                        webhook_type:
                          type: string
          example:
            success: true
            data:
              webhooks:
                - community: 50494
                  created_at: 1694895829823
                  id: 2
                  is_active: true
                  updated_at: 1694895829823
                  url: "https://eoja4x1itbjwnwc.m.pipedream.net"
                  webhook_type: "chatroom.joined"
                - community: 50494
                  created_at: 1694895836792
                  id: 3
                  is_active: true
                  updated_at: 1694895836792
                  url: "https://eoja4x1itbjwnwc.m.pipedream.net"
                  webhook_type: "chatroom.left"
                - community: 50494
                  created_at: 1694895853981
                  id: 4
                  is_active: true
                  updated_at: 1694895853981
                  url: "https://eoja4x1itbjwnwc.m.pipedream.net"
                  webhook_type: "profile.created"


post:
  operationId: enableWebhook
  security:
    - bearerAuth: []

  parameters:
    - $ref: "../components/parameters/headers/platformCode.yaml"
    - $ref: "../components/parameters/headers/apiKey.yaml"
  description: This API enables webhooks for an Community App
  tags:
  - Webhooks
  summary: Enable a new webhook
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            webhook_type:
              type: string
            url:
              type: string
            is_active:
              type: boolean
          required:
            - webhook_type
            - url
            - is_active
  responses:
    '200':
      description: Webhook created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  webhook:
                    type: object
                    properties:
                      community:
                        type: integer
                      created_at:
                        type: integer
                      id:
                        type: integer
                      is_active:
                        type: boolean
                      updated_at:
                        type: integer
                      url:
                        type: string
                      webhook_type:
                        type: string
          example:
            success: true
            data:
              webhook:
                community: 50494
                created_at: 1701715871365
                id: 11
                is_active: true
                updated_at: 1701715871365
                url: "https://eofhvt62vukcwsp.m.pipedream.net"
                webhook_type: "chatroom.left"