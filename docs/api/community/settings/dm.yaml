get:
  summary: Get Community Direct Message Settings
  operationId: getCommunityDMSettings
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../components/parameters/headers/versionCode.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  community_dm_settings:
                    type: object
                    properties:
                      community:
                        type: integer
                      duration:
                        type: string
                      number_in_duration:
                        type: integer
                      state:
                        type: integer




put:
  summary: Update Community Direct Message Settings
  operationId: updateCommunityDMSettings
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            state:
              type: integer
            duration:
              type: string
            number_in_duration:
              type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
