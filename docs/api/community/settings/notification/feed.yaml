get:
  summary: Get Community Feed Notification Settings
  operationId: getCommunityFeedNotificationSettings
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../../components/parameters/headers/apiKey.yaml"
  responses:
    "200":
      description: OK


put:
  summary: Update Community Feed Notification Settings
  operationId: updateCommunityFeedNotificationSettings
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            notification_settings:
              type: array
              items:
                type: object
                properties:
                  notification_type:
                    type: integer
                  enabled:
                    type: boolean
  responses:
    "200":
      description: OK
