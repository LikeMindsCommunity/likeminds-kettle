get:

  operationId: getCommunityConfigurations
  tags:
    - Community

  summary: Get Community Configurations
  description: This API fetches community configurations set for the community.
  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - name: configuration_types
      in: query
      description: Configuration types to get
      schema:
        type: array
        items:
          type: string
          enum: [media_limits, feed_metadata, profile_metadata, nsfw_filtering, guest_flow_metadata, personalised_feed_weights, widgets_metadata]

  responses:
    "200":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/communityConfigurations.yaml"
          example:
            success: true
            data:
              community_configurations:
                - description: "Personalised feed weights metadata for the community"
                  type: "personalised_feed_weights"
                  value:
                    comments_metrics:
                      max_threshold: 1000
                      weight: 10
                    likes_metrics:
                      max_threshold: 1000
                      weight: 10
                    post_dampening_metrics:
                      max_threshold: 100
                      weight: 10
                    recency_metrics:
                      max_threshold: 180000
                      weight: 10
                    user_connection_metrics:
                      max_threshold: 10
                      weight: 10
                    user_groups_metrics:
                      max_threshold: 10
                      weight: 10
                    user_topics_metrics:
                      max_threshold: 10
                      weight: 10
                - description: "Media size upload limit (in Kilobytes) for different file formats"
                  type: "media_limits"
                  value:
                    max_image_size: 5124
                    max_video_size: 102400
                - description: "Metadata related to feed and its entity"
                  type: "feed_metadata"
                  value:
                    comment: "comment"
                    like_entity_variable:
                      entity_name: "like"
                      past_tense_verb: "liked"
                    post: "post"
                    universal_feed:
                      comment_count: 1
                      comment_sort_order: ""
                      comment_sort_order_key: ""
                - description: "User profiles metadata for the community"
                  type: "profile_metadata"
                  value:
                    widgets_enabled: false
                - description: "NSFW filtering metadata for the community"
                  type: "nsfw_filtering"
                  value:
                    cutoff_score: 0.8
                    enabled: false
                    error_status: ""
                    inferdo_api_key: ""
                - description: "Widgets metadata for the community"
                  type: "widgets_metadata"
                  value:
                    message: false
                - description: "Community configurations for guest flow"
                  type: "guest_flow_metadata"
                  value:
                    guest_users: "SINGLE"

patch:
  operationId: updateCommunityConfigurations
  tags:
    - Community

  description: This API is used to update community configurations set for the community.
  summary: Update Community Configurations

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/platformType.yaml"
  
  requestBody:
    description: Community configuration to be updated
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              type: string
            value:
              type: object
              additionalProperties: true

        example:
          media_limits:
            type: "media_limits"
            value:
              max_image_size: 5124
              max_video_size: 102400
          feed_metadata:
            type: "feed_metadata"
            value:
              post: "post"
              comment: "comment"
              like_entity_variable:
                entity_name: "like"
                past_tense_verb: "liked"
          profile_metadata:
            type: "profile_metadata"
            value:
              widgets_enabled: false
          nsfw_filtering:
            type: "nsfw_filtering"
            value:
              enabled: false
              inferdo_api_key: ""
              cutoff_score: 0.8
              error_status: ""
          widgets_metadata:
            type: "widgets_metadata"
            value:
              message: false
          guest_flow_metadata:
            type: "guest_flow_metadata"
            value:
              guest_users: "SINGLE"
          personalised_feed_weights:
            type: "personalised_feed_weights"
            value:
              comments_metrics:
                max_threshold: 1000
                weight: 10
              likes_metrics:
                max_threshold: 1000
                weight: 10
              post_dampening_metrics:
                max_threshold: 100
                weight: 10
              recency_metrics:
                max_threshold: 180000
                weight: 10
              user_connection_metrics:
                max_threshold: 10
                weight: 10
              user_groups_metrics:
                max_threshold: 10
                weight: 10
              user_topics_metrics:
                max_threshold: 10
                weight: 10

  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  community_configurations:
                    type: array
                    items:
                      type: object
                      properties:
                        description:
                          type: string
                        type:
                          type: string
                        value:
                          type: object
                          additionalProperties: true

          example:
            success: true
            data:
              community_configuration:
                description: "Metadata related to feed and its entity"
                type: "feed_metadata"
                value:
                  comment: "comment"
                  post: "resource"
              record_updated: true
