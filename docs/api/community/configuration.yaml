get:

  operationId: getCommunityConfigurations
  tags:
    - Community

  summary: Get Community Configurations
  description: This API fetches community configurations set for the community.
  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - name: configuration_types
      in: query
      description: Configuration types to get
      schema:
        type: array
        items:
          type: string
          enum: [media_limits, feed_metadata, profile_metadata, nsfw_filtering, guest_flow_metadata, personalised_feed_weights, widgets_metadata, feed_settings]

  responses:
    "200":
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/responses/communityConfigurations.yaml"
          example:
            success: true
            data:
              community_configurations:
                - description: "Metadata related to feed and its entity"
                  type: "feed_metadata"
                  value:
                    comment: 
                      value : "response"
                      description: "entity name for comment"
                    post: 
                      value : "resource"
                      description: "entity name for post"
                    universal_feed:
                      comment_count: 
                        value : 1
                        description: "Count of comments in the universal feed"
                      comment_sort_order: 
                        value : "desc"
                        description: "Sort order for comments in the universal feed"
                      comment_sort_order_key: 
                        value : "likes"
                        description: "Key to sort comments in the universal feed"
                - description: "User profiles metadata for the community"
                  type: "profile_metadata"
                  value:
                    widgets_enabled: 
                      value : true
                      description: "Flag to enable widgets in user profiles"
                - description: "NSFW filtering metadata for the community"
                  type: "nsfw_filtering"
                  value:
                    cutoff_score: 
                      value : 0.8
                      description: "Cutoff score for NSFW filtering"
                    enabled: 
                      value : true
                      description: "Flag to enable NSFW filtering"
                    error_status: 
                      value : ""
                      description: "Error status for NSFW filtering"
                    inferdo_api_key: 
                      value : "0d53fddcdbmshde52db8f25***************************"
                      description: "API key for NSFW filtering service"
                - description: "Media size upload limit (in Kilobytes) for different file formats"
                  type: "media_limits"
                  value:
                    max_image_size: 
                      value : 10240
                      description: "Maximum size for image uploads in Kilobytes"
                    max_video_size: 
                      value : 102400
                      description: "Maximum size for video uploads in Kilobytes"
                - description: "Additional Feed settings for the community"
                  type: "feed_settings"
                  value:
                    auto_approve_post: 
                      value : "no_one"
                      description: "Scope for auto approving posts"
                    create_feed_poll: 
                      value : "everyone"
                      description: "Scope for creating feed polls"
                    menu_items_config:
                      hide_post: 
                        value : false
                        description: "Flag to hide post in menu items"
                    notification_feed_actions:
                      also_commented_on_post_you_commented: 
                        value : true
                        description: "Notify when someone comments on a post you commented on"
                      comment_on_your_comment: 
                        value : true
                        description: "Notify when someone comments on your comment"
                      comment_on_your_post: 
                        value : true
                        description: "Notify when someone comments on your post"
                      like_on_your_comment: 
                        value : true
                        description: "Notify when someone likes your comment"
                      like_on_your_post: 
                        value : true
                        description: "Notify when someone likes your post"
                      reposted_your_post: 
                        value : true
                        description: "Notify when someone reposts your post"
                      tagged_you_on_comment_post: 
                        value : true
                        description: "Notify when someone tags you on a comment or post"
                      tagged_you_on_post: 
                        value : true
                        description: "Notify when someone tags you on a post"
                - description: "Widgets metadata for the community"
                  type: "widgets_metadata"
                  value:
                    message: 
                      value : false
                      description: "Flag to enable message widgets in the community"
                - description: "Community configurations for guest flow"
                  type: "guest_flow_metadata"
                  value:
                    guest_users: 
                      value : "SINGLE"
                      enum : ["SINGLE", "MULTIPLE"]
                      description: "Guest user flow configuration either SINGLE or MULTIPLE"
                - description: "Personalised feed weights metadata for the community"
                  type: "personalised_feed_weights"
                  value:
                    comments_metrics:
                      value : 
                        max_threshold: 100
                        weight: 1
                      description: "Weight and Max threshold (ceiling value for comments count) for comments likes_metrics"
                    likes_metrics:
                      value :
                        max_threshold: 100
                        weight: 1
                      description: "Weight and Max threshold (ceiling value for likes count) for likes metrics"
                    post_dampening_metrics:
                      value :
                        max_threshold: 300
                        weight: 10
                      description: "Reduces the visibility of posts over time by applying a negative score to posts viewed within the past 24 hours."
                    recency_metrics:
                      value :
                        max_threshold: 1800000
                        weight: 10
                      description: "Weight and Max threshold (ceiling value in milliseconds) for recency metrics"
                    user_connection_metrics:
                      value : 
                        max_threshold: 10
                        weight: 10
                      description: "Weight and Max threshold for user connections metrics"
                    user_groups_metrics:
                      value :
                        max_threshold: 10
                        weight: 10
                      description: "Weight and Max threshold for user groups metrics"
                    user_topics_metrics:
                      value :
                        max_threshold: 10
                        weight: 10
                      description: "Weight and Max threshold for user topics metrics"
                - description: "Chatbot configurations for the community"
                  type: "chatbot"
                  value:
                    api_key: 
                      value : ""
                      description: "API key for chatbot service"
                    enabled: 
                      value : false
                      description: "Flag to enable chatbot in the community"
                    error_message: 
                      value : ""
                      description: "Error message for chatbot service"
                    provider: 
                      value : ""
                      description: "Provider for the chatbot service"
                - description: "Chat poll configurations for the community."
                  type: "chat_poll"
                  value:
                    allow_add_option: 
                      value : false
                      description: "Flag to allow adding options in chat polls"
                    allow_override: 
                      value : true
                      description: "Flag to allow overriding poll options"
                    allow_vote_change: 
                      value : true
                      description: "Flag to allow changing votes in chat polls"
                    is_anonymous: 
                      value : false
                      description: "Flag to make chat polls anonymous"
                    multiple_select_no: 
                      value : 1
                      description: "Number of options allowed for multiple selection in chat polls"
                    multiple_select_state: 
                      value : "exactly"
                      description: "State for multiple selection in chat polls"
                    no_poll_expiry: 
                      value : false
                      description: "Flag to disable poll expiry"
                    poll_type: 
                      value : "instant"
                      description: "Type of chat poll, e.g., instant or scheduled"
                - description: "Community configurations for reply privately"
                  type: "reply_privately"
                  value:
                    allowed_scope: 
                      value : "NO_ONE"
                      description: "Scope for allowing reply privately, e.g., NO_ONE, EVERYONE"
                - description: "Custom app views for different screens for feed or chat"
                  type: "app_views"
                  value:
                    feed:
                      home: {}
                      
patch:
  operationId: updateCommunityConfigurations
  tags:
    - Community

  description: This API is used to update community configurations set for the community.
  summary: Update Community Configurations

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/platformType.yaml"
  
  requestBody:
    description: Community configuration to be updated
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              type: string
            value:
              type: object
              additionalProperties: true

        example:
          media_limits:
            type: "media_limits"
            value:
              max_image_size: 5124
              max_video_size: 102400
          feed_metadata:
            type: "feed_metadata"
            value:
              post: "post"
              comment: "comment"
              like_entity_variable:
                entity_name: "like"
                past_tense_verb: "liked"
              anonymous_user_meta:
                name: Anonymous User
                image_url: ""
          profile_metadata:
            type: "profile_metadata"
            value:
              widgets_enabled: false
          nsfw_filtering:
            type: "nsfw_filtering"
            value:
              enabled: false
              inferdo_api_key: ""
              cutoff_score: 0.8
              error_status: ""
          widgets_metadata:
            type: "widgets_metadata"
            value:
              message: false
          guest_flow_metadata:
            type: "guest_flow_metadata"
            value:
              guest_users: "SINGLE"
          personalised_feed_weights:
            type: "personalised_feed_weights"
            value:
              comments_metrics:
                description: "Weight and Max threshold (ceiling value for comments count) for comments metrics"
                max_threshold: 1000
                weight: 10
              likes_metrics:
                description: "Weight and Max threshold (ceiling value for likes count) for likes metrics"
                max_threshold: 1000
                weight: 10
              post_dampening_metrics:
                description: "Reduces the visibility of posts over time by applying a negative score to posts viewed within the past 24 hours."
                max_threshold: 100
                weight: 10
              recency_metrics:
                description: "Weight and Max threshold (ceiling value in seconds) for recency metrics"
                max_threshold: 180000
                weight: 10
              user_connection_metrics:
                description: "Weight and Max threshold for user connections metrics"
                max_threshold: 10
                weight: 10
              user_groups_metrics:
                description: "Weight and Max threshold for user groups metrics"
                max_threshold: 10
                weight: 10
              user_topics_metrics:
                description: "Weight and Max threshold for user topics metrics"
                max_threshold: 10
                weight: 10

  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
