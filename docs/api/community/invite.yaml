post:
  summary: Invite to Community

  operationId: inviteToCommunity

  tags:
    - Community

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              type: string
              description: Type of invitation (e.g., "mobile")
            mobile_no:
              type: string
              description: Mobile number to invite
          required:
            - type
            - mobile_no

  responses: {}
