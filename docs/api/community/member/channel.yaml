get:
  summary: Get Community Member Channels
  operationId: getCommunityMemberChannels
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/path/user_id.yaml"
    - $ref: "../../../components/parameters/query/state.yaml"
    - $ref: "../../../components/parameters/query/page.yaml"
    - $ref: "../../../components/parameters/query/channelType.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:  
                  chatrooms:
                    type: array
                    items:
                      $ref: "../../../components/schemas/responses/chatroom.yaml"
                  total_chatrooms_followed:
                    type: integer
