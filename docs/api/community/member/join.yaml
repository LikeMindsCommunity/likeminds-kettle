put:
  summary: Join Community

  operationId: joinCommunity

  tags:
    - Community

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"

  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            uuid:
              type: string
              description: User Unique ID
            is_accepted:
              type: boolean
              description: Whether the join request is accepted or not
          required:
            - uuid
            - is_accepted

  responses: {}
