get:
  summary: Get Community Member State
  operationId: getCommunityMemberState
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../../components/parameters/headers/sdkSource.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  created_at:
                    type: integer
                  edit_required:
                    type: boolean
                  member:
                    $ref: "../../../components/schemas/responses/member.yaml"
                  member_rights:
                    $ref: "../../../components/schemas/responses/memberRights.yaml"
                  state:
                    type: integer
                  tool_state:
                    type: integer
