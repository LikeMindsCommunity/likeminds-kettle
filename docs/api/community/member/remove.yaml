delete:
  summary: Remove Community Members
  operationId: removeCommunityMembers
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/platformType.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
    - name: member_ids
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    - name: reason
      in: query
      required: true
      schema:
        type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/responses/community_member_remove.yaml"
