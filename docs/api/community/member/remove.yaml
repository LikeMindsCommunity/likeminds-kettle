delete:
  summary: Remove Community Members
  operationId: removeCommunityMembers
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - name: Authorization
      in: header
      required: true
      schema:
        type: string
        format: text
    - name: x-platform-type
      in: header
      schema:
        type: string
        format: text
    - name: x-api-key
      in: header
      schema:
        type: string
        format: text
    - name: member_ids
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
    - name: reason
      in: query
      required: true
      schema:
        type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
