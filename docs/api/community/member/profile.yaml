get:
  operationId: getMemberProfile
  tags:
    - Member

  summary: Get Community Member Profile
  description: This API fetches the profile of a community member

  security:
    - bearerAuth: []
  
  parameters:
    - $ref: "../../../components/parameters/headers/platformType.yaml"
    - $ref: "../../../components/parameters/query/uuid.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/responses/community_member_profile_get.yaml"


put:

  operationId: updateMemberProfile
  tags:
    - Member

  summary: Update Community Member Profile
  description: This API updates the profile of a community member such as name, image, metadata, etc.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../components/parameters/headers/platformType.yaml"
    - $ref: "../../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../../components/parameters/headers/platformCode.yaml"

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/requests/community_member_profile.yaml"
          
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/responses/community_member_profile_update.yaml"
