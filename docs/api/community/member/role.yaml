get:
  summary: Get Community Member Role and Rights
  operationId: getCommunityMemberRole
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../../components/parameters/headers/sdkSource.yaml"
    - $ref: "../../../components/parameters/headers/acceptVersion.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  admin_rights:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        is_selected:
                          type: boolean
                        title:
                          type: string
                  created_at:
                    type: integer
                  member:
                    type: object
                    properties:
                      custom_title:
                        type: string
                      id:
                        type: integer
                      image_url:
                        type: string
                      is_guest:
                        type: boolean
                      is_owner:
                        type: boolean
                      name:
                        type: string
                      organisation_name:
                        type: null
                      question_answers:
                        type: array
                        items:
                          type: object
                          properties:
                            community_id:
                              type: integer
                            directory_fields:
                              type: boolean
                            is_hidden:
                              type: boolean
                            member_id:
                              type: integer
                            question_id:
                              type: integer
                            question_title:
                              type: string
                            state:
                              type: integer
                            tag:
                              type: null
                            value:
                              type: string
                      sdk_client_info:
                        type: object
                        properties:
                          community:
                            type: integer
                          user:
                            type: integer
                          user_unique_id:
                            type: string
                          uuid:
                            type: string
                      updated_at:
                        type: integer
                      user_unique_id:
                        type: string
                      uuid:
                        type: string
                  member_rights:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        is_locked:
                          type: boolean
                        is_selected:
                          type: boolean
                        title:
                          type: string
                  role:
                    type: string
