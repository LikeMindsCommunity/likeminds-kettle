get:
  summary: Fetch Community Removal Reports
  operationId: fetchCommunityRemovalReports
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  removal_reports:
                    type: array
                    items:
                      type: object
                      properties:
                        last_modified:
                          type: string
                          format: date-time
                        url:
                          type: string
