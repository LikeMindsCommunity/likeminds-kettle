get:
  summary: Get Community Branding

  operationId: getCommunityBranding

  tags:
    - Community

  security:
    - bearerAuth: []

  parameters:
    - name: Authorization
      in: header
      required: true
      schema:
        type: string
        format: text
    - name: x-api-key
      in: header
      required: true
      schema:
        type: string
        format: text
    - name: x-platform-code
      in: header
      description: Platform Code
      schema:
        type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  branding:
                    type: object
                    properties:
                      advanced:
                        type: object
                        properties:
                          buttons_icons_colour:
                            type: string
                          header_colour:
                            type: string
                          text_links_colour:
                            type: string
                      basic:
                        type: object
                        properties:
                          primary_colour:
                            type: string
