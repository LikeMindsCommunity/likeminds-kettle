get:
      operationId: getCommunityMembers
      tags:
        - Community
      summary: Fetch Community Members
      description: |-
        This API fetches members of a community

        #### Request

        ##### Header

        It takes the following parameters in headers:

        *   `Authorization`: String | JWT token
        *   `x-api-key`: String | API Key
        *   `x-platform-code` : String | Platform Code | nullable
        *   `x-version-code`: String | Version Code | nullable
            

        ##### Params

        It takes following parameters in query params:

        *   `page`: Int | Page number | Nullable
            

        #### Response

        This API returns following keys in response body:

        *   `success`: bool
        *   `error_message` String | Nullable
        *   `data` : JSON Object | Contains Response
            *   `members`: JSON Array | List of members
                *   `custom_intro_text`: String | Intro Text of Users
                *   `custom_title`: String | Tile of User
                *   `id`: Int | User ID
                *   `is_guest` : bool | If user is guest user
                *   `is_owner`: bool | If user is owner
                *   `member_since`: String | Community Member Since
                *   `menu`: JSON Array | Menu actions
                    *   `route`: String | action route
                    *   `title`: String | action title
                *   `name`: String | User Name
                *   `route`: String | Member profile route
                *   `state`: Int | Member state
                *   `updated_at`: Int | Last updated at
      parameters:
        - $ref: "../../components/parameters/headers/platformCode.yaml"
        - $ref: "../../components/parameters/headers/versionCode.yaml"
        - $ref: "../../components/parameters/headers/platformType.yaml"
        - $ref: "../../components/parameters/headers/apiKey.yaml"
        - name: page
          in: query
          schema:
            type: integer
          example: 1
      responses:
