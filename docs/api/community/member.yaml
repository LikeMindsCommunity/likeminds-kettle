get:
      operationId: getCommunityMembers
      tags:
        - Community
      summary: Fetch Community Members
      description: |-
        This API fetches members of a community
      parameters:
        - $ref: "../../components/parameters/headers/platformCode.yaml"
        - $ref: "../../components/parameters/headers/versionCode.yaml"
        - $ref: "../../components/parameters/headers/platformType.yaml"
        - $ref: "../../components/parameters/headers/apiKey.yaml"
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
        - name: member_state
          in: query
          description: Member state filter
          required: false
          schema:
            type: integer
        - name: question_answers_version
          in: query
          description: Question answers version to send in response
          required: false
          schema:
            type: string
            default: v1
            enum:
              - v1
              - v2
        
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      community:
                        $ref: "../../components/schemas/communityResponse.yaml"
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            custom_intro_text:
                              type: string
                            custom_title:
                              type: string
                            id:
                              type: integer
                            image_url:
                              type: string
                            is_guest:
                              type: boolean
                            is_owner:
                              type: boolean
                            member_since:
                              type: string
                            member_since_epoch:
                              type: integer
                            menu:
                              type: array
                              items:
                                type: object
                                properties:
                                  route:
                                    type: string
                                  title:
                                    type: string
                            name:
                              type: string
                            organisation_name:
                              type: string
                            question_answers:
                              type: object
                            route:
                              type: string
                            sdk_client_info:
                              type: object
                            state:
                              type: integer
                            updated_at:
                              type: integer
                            user_unique_id:
                              type: string
                            uuid:
                              type: string
                      total_filtered_members:
                        type: integer
                      total_members:
                        type: integer
                      total_only_members:
                        type: integer
                      total_pending_members:
                        type: integer

post:
    operationId: createCommunityMember
    tags:
        - Community
    summary: Fetch Community Members
    description: |-
      This API fetches members of a community
    parameters:
      - $ref: "../../components/parameters/headers/platformCode.yaml"
      - $ref: "../../components/parameters/headers/versionCode.yaml"
      - $ref: "../../components/parameters/headers/platformType.yaml"
      - $ref: "../../components/parameters/headers/apiKey.yaml"
    responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                success: true
                data:
                  type: object
                  properties:
                    community:
                      type: object
                      properties:
                        auto_approval:
                          type: boolean
                        branding:
                          type: object
                          properties:
                            advanced:
                              type: object
                              properties:
                                buttons_icons_colour:
                                  type: string
                                header_colour:
                                  type: string
                                text_links_colour:
                                  type: string
                            basic:
                              type: object
                              properties:
                                primary_colour:
                                  type: string
                        community_setting_rights:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              is_locked:
                                type: boolean
                              is_selected:
                                type: boolean
                              state:
                                type: integer
                              title:
                                type: string
                              sub_title:
                                type: string
                        fee_event:
                          type: integer
                        fee_membership:
                          type: integer
                        fee_payment_pages:
                          type: integer
                        grace_period:
                          type: integer
                        hide_dm_tab:
                          type: boolean
                        id:
                          type: integer
                        image_url:
                          type: string
                        is_discoverable:
                          type: boolean
                        is_freemium_community:
                          type: boolean
                        is_paid:
                          type: boolean
                        is_whitelabel:
                          type: boolean
                        members_count:
                          type: integer
                        name:
                          type: string
                        purpose:
                          type: string
                        referral_enabled:
                          type: boolean
                        sub_type:
                          type: integer
                        type:
                          type: integer
                        updated_at:
                          type: integer
                        whitelabel_info:
                          type: object
                    user:
                      type: object
                      properties:
                        id:
                          type: integer
                        image_url:
                          type: string
                        is_guest:
                          type: boolean
                        name:
                          type: string
                        organisation_name:
                          type: string
                        sdk_client_info:
                          type: object
                        updated_at:
                          type: integer
                        user_unique_id:
                          type: string
                        uuid:
                          type: string