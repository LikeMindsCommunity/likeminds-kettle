get:
  summary: Get Community Details

  operationId: getCommunityDetails

  tags:
    - Community

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  community:
                    $ref: "../../components/schemas/responses/community.yaml"
                  menu:
                    type: array
                    items:
                      type: string
