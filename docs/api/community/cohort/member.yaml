delete:
  summary: Remove Member from Community Cohort
  operationId: removeMemberFromCommunityCohort
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
    - name: body
      in: body
      description: Cohort member removal request body
      required: true
      schema:
        type: object
        properties:
          cohort_id:
            type: integer
          user_id:
            type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
