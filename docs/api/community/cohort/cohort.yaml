post:
  summary: Create Community Cohort
  operationId: createCommunityCohort
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            member_ids:
              type: array
              items:
                type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/responses/community_cohort_create.yaml"



get:
  summary: Get Community Cohort
  operationId: getCommunityCohort
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/platformType.yaml"
    - name: cohort_id
      in: query
      schema:
        type: integer
      required: true
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/responses/community_cohort_get.yaml"




delete:
  summary: Delete Community Cohort
  operationId: deleteCommunityCohort
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            cohort_id:
              type: integer
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean




put:
  summary: Update Community Cohort
  operationId: updateCommunityCohort
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/community_cohort_update.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
