get:
  summary: Get Chatroom Cohort Access
  operationId: getChatroomCohortAccess
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../../components/parameters/query/chatroomId.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  cohort_data:
                    type: array
                    items:
                      type: object
                      properties:
                        chatroom_id:
                          type: integer
                        cohort_access:
                          type: integer
                        cohort_id:
                          type: integer


put:
  summary: Update Chatroom Cohort Access
  operationId: updateChatroomCohortAccess
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../components/parameters/headers/versionCode.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/requests/cohort_access.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
