get:
  summary: Get Community Rights
  operationId: getCommunityRights
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../components/parameters/headers/sdkSource.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  rights:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        is_locked:
                          type: boolean
                        is_selected:
                          type: boolean
                        state:
                          type: integer
                        title:
                          type: string
                        sub_title:
                          type: string




patch:
  summary: Update Community Rights
  operationId: updateCommunityRights
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/requests/community_rights.yaml"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
