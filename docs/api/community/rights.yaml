get:
  summary: Get Community Rights
  operationId: getCommunityRights
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - name: Authorization
      in: header
      schema:
        type: string
        format: text
    - name: x-platform-type
      in: header
      schema:
        type: string
        format: text
    - name: x-platform-code
      in: header
      schema:
        type: string
        format: text
    - name: x-version-code
      in: header
      schema:
        type: string
        format: text
    - name: x-sdk-source
      in: header
      schema:
        type: string
        format: text
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: object
                properties:
                  rights:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        is_locked:
                          type: boolean
                        is_selected:
                          type: boolean
                        state:
                          type: integer
                        title:
                          type: string
                        sub_title:
                          type: string




patch:
  summary: Update Community Rights
  operationId: updateCommunityRights
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - name: Authorization
      in: header
      schema:
        type: string
        format: text
    - name: x-platform-type
      in: header
      schema:
        type: string
        format: text
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            rights:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  is_locked:
                    type: boolean
                  is_selected:
                    type: boolean
                  title:
                    type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
