delete:
  summary: Remove Community Manager
  operationId: removeCommunityManager
  tags:
    - Community
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformType.yaml"
    - name: user_id
      in: body
      required: true
      schema:
        type: object
        properties:
          user_id:
            type: string
            format: uuid
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
