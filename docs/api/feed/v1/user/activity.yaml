get:
  summary: Get User Activity Feed

  operationId: getUserActivityFeed

  tags:
    - Feed - V1

  description: Get user activity feed

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../../components/parameters/query/page.yaml"
    - $ref: "../../../../components/parameters/query/pageSize.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        action:
                          type: integer
                        action_by:
                          type: array
                          items:
                            type: string
                        action_on:
                          type: string
                        activity_entity_data:
                          type: object
                          properties:
                            _id:
                              type: string
                            attachments:
                              type: array
                              items:
                                type: object
                                properties:
                                  attachment_meta:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                      og_tags:
                                        type: object
                                      url:
                                        type: string
                                  attachment_type:
                                    type: integer
                              required:
                                - attachment_meta
                                - attachment_type
                            chatroom_id:
                              type: integer
                            community_id:
                              type: integer
                            created_at:
                              type: string
                            delete_reason:
                              type: string
                            deleted_by:
                              type: string
                            heading:
                              type: string
                            is_deleted:
                              type: boolean
                            is_edited:
                              type: boolean
                            is_pinned:
                              type: boolean
                            text:
                              type: string
                            updated_at:
                              type: string
                            user_id:
                              type: string
                          required:
                            - _id
                            - created_at
                            - updated_at
                            - user_id
                        activity_text:
                          type: string
                        activity_user_data:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              members:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    image_url:
                                      type: string
                                    is_guest:
                                      type: boolean
                                    name:
                                      type: string
                                    user_unique_id:
                                      type: string
                                required:
                                  - id
                                  - name
                              success:
                                type: boolean
                          required:
                            - members
                            - success
                        created_at:
                          type: integer
                        cta:
                          type: string
                        entity_id:
                          type: string
                        entity_owner_id:
                          type: string
                        entity_type:
                          type: integer
                        is_read:
                          type: boolean
                        updated_at:
                          type: integer
                  total_count:
                    type: integer
