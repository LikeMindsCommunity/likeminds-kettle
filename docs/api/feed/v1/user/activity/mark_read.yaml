post:
  summary: Update activity with given ID as read by the user

  operationId: markActivityAsRead

  tags:
    - Feed - V1

  security:
    - bearerAuth: []

  parameters:
    - name: activity_id
      in: path
      description: ID of the activity to mark as read
      required: true
      schema:
        type: string

  requestBody:
    description: Activity ID to mark as read
    required: true
    content:
      application/json:
        example: {}
    
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../../components/schemas/responses/feed_activity_markread.yaml"
