post:
  operationId: createTopic

  summary: Create a new topic
  description: This API is used to create new topic/s

  tags:
    - Feed - V1

  security:
    - bearerAuth: []

  requestBody:
    description: Topic details to be created
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../../components/schemas/requests/feed_topic_create.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_topic_create.yaml"


get:
  operationId: getTopics

  summary: Get topics based on filters
  description: This API is used to get topics based on filters

  tags:
    - Feed - V1

  security:
    - bearerAuth: []

  parameters:
  - name: page
    in: query
    description: Page number
    schema:
      type: integer
  - name: page_size
    in: query
    description: Number of items per page
    schema:
      type: integer
  - name: search_type
    in: query
    description: Type of search
    schema:
      type: string
      enum:
        - name
  - name: search
    in: query
    description: Search query
    schema:
      type: string
  - name: is_enabled
    in: query
    description: Filter by enabled status
    schema:
      type: boolean
  - name: min_posts
    in: query
    description: Topics with minimum number of posts
    schema:
      type: integer
  - name: parent_ids
    in: query
    description: Array of parent ids | get children of these topics
    schema:
      type: array
      items:
        type: string
  - name: order_by
    in: query
    description: Order by field
    schema:
      type: array
      items:
        type: string
        enum:
          - alphabetical_asc
          - priority_desc
          - created_at_desc
          - number_of_posts_desc
    example: []
    
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_topic_get.yaml"
