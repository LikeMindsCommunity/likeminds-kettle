put:
  summary: Update a topic by ID

  operationId: updateTopicById

  tags:
    - Feed - V1

  security:
    - bearerAuth: []

  parameters:
    - name: topic_id
      in: path
      description: ID of the topic to be updated
      required: true
      schema:
        type: string

  requestBody:
    description: Updated topic details
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../../components/schemas/requests/feed_topic_update.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_topic_update.yaml"
