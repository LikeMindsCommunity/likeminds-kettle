put:
  summary: Pin a Post

  operationId: pinPost

  tags:
    - Feed - V1

  description: |
    This API pins a Post.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/headers/authToken.yaml"
    - name: post_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the post to pin

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
