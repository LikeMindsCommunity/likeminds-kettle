put:
  summary: Like a Post

  operationId: likePost

  tags:
    - Feed - V1

  description: |
    This API likes a Post.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/path/post_id.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_post_like.yaml"


get:
  summary: Get Post Likes

  operationId: getPostLikes

  tags:
    - Feed - V1

  description: |
    This API fetches likes for a Post.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/path/post_id.yaml"
    - $ref: "../../../../components/parameters/query/page.yaml"
    - $ref: "../../../../components/parameters/query/pageSize.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_post_like_get.yaml"
