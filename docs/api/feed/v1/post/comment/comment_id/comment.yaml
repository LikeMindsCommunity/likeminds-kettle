---
post:
  summary: Reply a comment in the post

  operationId: replyComment

  tags:
    - Feed - V1

  description: |
    This API creates a reply on a comment over a Post.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../../../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../../../../../components/parameters/path/post_id.yaml"
    - $ref: "../../../../../../components/parameters/path/comment_id.yaml"

  requestBody:
    description: The reply details of the comment
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../../../../components/schemas/requests/feed_comment.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../../../components/schemas/responses/feed_comment_create.yaml"
