put:
  summary: Like a Comment on a Post

  operationId: likeCommentOnPost

  tags:
    - Feed - V1

  description: This API likes a Comment.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../../../components/parameters/headers/authToken.yaml"
    - name: post_id
      in: path
      description: ID of the post containing the comment
      schema:
        type: string
    - name: comment_id
      in: path
      description: ID of the comment to be liked
      schema:
        type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string


get:
  summary: Fetch Comment Likes

  operationId: fetchCommentLikes

  tags:
    - Feed - V1

  description: This API fetches Comment likes.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../../../components/parameters/headers/authToken.yaml"
    - name: post_id
      in: path
      description: ID of the post containing the comment
      schema:
        type: string
    - name: comment_id
      in: path
      description: ID of the comment to fetch likes for
      schema:
        type: string
    - name: page
      in: query
      description: Page number
      schema:
        type: integer
    - name: page_size
      in: query
      description: Page size
      schema:
        type: integer

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  total_likes:
                    type: integer
                  likes:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        created_at:
                          type: integer
                        updated_at:
                          type: integer
                        user:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            image_url:
                              type: string
                            user_unique_id:
                              type: string
                            is_guest:
                              type: boolean
