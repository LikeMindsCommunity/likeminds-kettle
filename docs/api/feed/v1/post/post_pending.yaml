  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../../components/schemas/requests/feed_post_create.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_post_create.yaml"

