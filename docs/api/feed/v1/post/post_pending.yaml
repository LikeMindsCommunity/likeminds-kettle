post:
  operationId: createPendingPost
  tags:
    - Feed - V1

  summary: Create a New Pending Post
  description: This API creates a new pending post.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../../../components/parameters/headers/acceptVersion.yaml"
    

  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../../components/schemas/requests/feed_post_create.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: "../../../../components/schemas/responses/feed_post_pending_POST.yaml"

