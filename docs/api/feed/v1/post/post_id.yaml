delete:
  summary: Delete a Post

  operationId: deletePost

  tags:
    - Feed - V1

  description: This API deletes a Post.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../../components/parameters/path/post_id.yaml"
      
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            delete_reason:
              type: string

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
