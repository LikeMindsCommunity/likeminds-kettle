get:
  summary: Fetch Post Details

  operationId: fetchPostDetails

  tags:
    - Feed - V1

  description: This API fetches Post Details.

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../../../components/parameters/headers/versionCode.yaml"
    - $ref: "../../../../components/parameters/headers/authToken.yaml"
    - $ref: "../../../../components/parameters/path/post_id.yaml"

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
                nullable: true
              data:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      _id:
                        type: string
                      text:
                        type: string
                      attachments:
                        type: array
                        items:
                          type: object
                          properties:
                            attachment_type:
                              type: integer
                            attachment_meta:
                              type: object
                              properties:
                                url:
                                  type: string
                                  nullable: true
                                format:
                                  type: string
                                  nullable: true
                                size:
                                  type: integer
                                  nullable: true
                                duration:
                                  type: integer
                                  nullable: true
                                page_count:
                                  type: integer
                                  nullable: true
                                og_tags:
                                  type: object
                                  properties:
                                    title:
                                      type: string
                                      nullable: true
                                    image:
                                      type: string
                                      nullable: true
                                    description:
                                      type: string
                                      nullable: true
                                    url:
                                      type: string
                                      nullable: true
                      community_id:
                        type: integer
                      is_pinned:
                        type: boolean
                      is_saved:
                        type: boolean
                      is_edited:
                        type: boolean
                      user_id:
                        type: string
                      uuid:
                        type: string
                      likes_count:
                        type: integer
                      comments_count:
                        type: integer
                      menu_items:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                      replies:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id:
                              type: string
                            text:
                              type: string
                            post_id:
                              type: string
                            level:
                              type: integer
                            likes_count:
                              type: integer
                            replies_count:
                              type: integer
                            menu_items:
                              type: array
                              items:
                                type: object
                                properties:
                                  title:
                                    type: string
                      created_at:
                        type: integer
                      updated_at:
                        type: integer


