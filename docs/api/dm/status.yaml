get:
  summary: Community DM Status

  operationId: communityDMStatus

  tags:
    - DM

  security:
    - bearerAuth: []

  parameters:
    - $ref: "../../components/parameters/headers/authToken.yaml"
    - $ref: "../../components/parameters/headers/apiKey.yaml"
    - $ref: "../../components/parameters/headers/platformCode.yaml"
    - $ref: "../../components/parameters/headers/versionCode.yaml"
    - name: req_from
      in: query
      description: Type of page user is requested from
      required: true
      schema:
        type: string
      enum:
        - member_profile
        - community_detail
        - dm_feed
        - member_directory
        - chatroom
        - user_channel
    - $ref: "../../components/parameters/query/memberId.yaml"
    - $ref: "../../components/parameters/query/chatroomId.yaml"


  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              error_message:
                type: string
              data:
                type: object
                properties:
                  cta:
                    type: string
                  show_dm:
                    type: boolean
